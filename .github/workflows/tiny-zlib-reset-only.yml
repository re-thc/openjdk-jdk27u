name: Fixed thin zlib-ng reset comparison
on:
  push:
    branches: [diagnostic/tiny-zlib-reset-only-20261015]
    paths:
      - .github/scripts/reset-only/**
      - .github/workflows/tiny-zlib-reset-only.yml
permissions:
  contents: read
concurrency:
  group: thin-reset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-reset-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: production
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts/reset-only
            .github/workflows
          persist-credentials: false
      - name: Native compiler prerequisites
        run: |
          if ! command -v gcc-14 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gcc-14 make python3
          fi
      - name: Build, check invariants, then execute the single approved attempt
        run: python3 production/.github/scripts/reset-only/reset-study.py --root production --out validation/thin-reset --execute-once
      - name: Export saved evidence only
        if: always()
        run: |
          python3 production/.github/scripts/reset-only/reset-score.py --export-local validation/thin-reset
          if test -f validation/thin-reset/REPORT.txt; then
            cat validation/thin-reset/REPORT.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: zlib-thin-reset-evidence-${{ github.run_id }}
          path: validation/thin-reset
          retention-days: 90
          if-no-files-found: error
