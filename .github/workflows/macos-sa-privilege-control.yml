name: macOS SA privilege control
on:
  push:
    branches: [pr/diagnose-macos-sa-privileges]
concurrency:
  group: macos-sa-privilege-control
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  stop:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo 'Desktop-dependent modules and tools have been removed from the requested profile. Stop SA diagnostics.'
