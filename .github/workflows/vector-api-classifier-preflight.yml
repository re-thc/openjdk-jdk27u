name: Classifier candidate build and correctness preflight only
'on':
  push:
    branches:
    - codex/vector-api-classifier-preflight
permissions:
  contents: read
  actions: read
concurrency:
  group: vector-api-classifier-preflight
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  candidate-build:
    if: github.ref == 'refs/heads/codex/vector-api-classifier-preflight' && github.run_attempt == 1
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        level:
        - release
        - fastdebug
    steps:
    - name: Set capture deadline before the job timeout
      run: echo "CLASSIFIER_CAPTURE_DEADLINE=$(( $(date +%s) + 80 * 60 ))" >> "$GITHUB_ENV"
      timeout-minutes: 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      timeout-minutes: 5
    - name: Check pinned authorized input metadata before compute
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        mkdir input-metadata
        for artifact_id in 11978661561 11981413932 11881672203 12015894519; do
          gh api "repos/re-thc/openjdk-jdk27u/actions/artifacts/$artifact_id" > "input-metadata/$artifact_id.json"
          python3 qualification/native_unroll/classifier_inputs.py metadata "input-metadata/$artifact_id.json" --artifact-id "$artifact_id"
        done
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38738016505
        artifact-ids: 11978661561
        path: historical-release
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38738016505
        artifact-ids: 11981413932
        path: historical-fastdebug
        merge-multiple: true
      if: matrix.level == 'fastdebug'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38813879807
        artifact-ids: 12015894519
        path: jtreg
        merge-multiple: true
    - name: Verify retained jtreg consumer bytes before either native build
      run: python3 qualification/native_unroll/classifier_inputs.py jtreg jtreg
      timeout-minutes: 2
    - name: Install native tools without retrying the job
      timeout-minutes: 18
      run: |-
        timeout 8m sudo apt -o Acquire::Retries=0 update
        timeout 8m sudo apt -o Acquire::Retries=0 install -y gcc-16 g++-16 autoconf make zip unzip zlib1g-dev
        curl --fail --location --max-time 120 https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-aarch64-linux.tar.gz --output "$RUNNER_TEMP/mold.tar.gz"
        echo "52c759d3689babaea4c42af2f31062a74ab83e17ffb5a8090232534c67b70577  $RUNNER_TEMP/mold.tar.gz" | sha256sum --check
        mkdir "$RUNNER_TEMP/mold"
        tar -xf "$RUNNER_TEMP/mold.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mold"
        echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
    - name: Build one new candidate overlay only
      env:
        BUILD_LEVEL: ${{ matrix.level }}
      run: |-
        remaining=$(( CLASSIFIER_CAPTURE_DEADLINE - $(date +%s) ))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=30s "${remaining}s" bash -euo pipefail <<'CLASSIFIER_CAPTURE_BOUND'
        test "$(uname -m)" = aarch64
        python3 qualification/native_unroll/classifier_inputs.py extract historical-release/rebuilt-b3-jdk.tar.gz control-release
        if [[ "$BUILD_LEVEL" == fastdebug ]]; then
          python3 qualification/native_unroll/classifier_inputs.py extract historical-fastdebug/rebuilt-b3-jdk.tar.gz control-fastdebug
        fi
        remaining=$(( CLASSIFIER_CAPTURE_DEADLINE - $(date +%s) ))
        test "$remaining" -gt 0
        set +e
        timeout --signal=TERM --kill-after=30s "${remaining}s" python3 qualification/native_unroll/build_classifier_image.py --historical-built "historical-$BUILD_LEVEL" --template-jdk "control-$BUILD_LEVEL/rebuilt-b3-jdk" --boot-built historical-release --boot-jdk control-release/rebuilt-b3-jdk --out backend-build --level "$BUILD_LEVEL" --execute
        status=$?
        mkdir -p backend-build
        printf '{"exit_status":%s,"job_retry":false}\n' "$status" > backend-build/producer-status.json
        exit "$status"
        CLASSIFIER_CAPTURE_BOUND
      timeout-minutes: 81
    - name: Capture available input metadata after producer exit
      if: always()
      run: |-
        mkdir -p backend-build
        if [[ -d input-metadata ]]; then cp -a input-metadata backend-build/input-metadata; fi
      timeout-minutes: 2
    - name: Preserve completed or partial producer evidence before the90-minute cap
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: classifier-candidate-${{ matrix.level }}
        path: |-
          backend-build/*.tar.gz
          backend-build/*.json
          backend-build/candidate
          backend-build/input-metadata
        retention-days: 30
      timeout-minutes: 5
  preflight:
    if: github.ref == 'refs/heads/codex/vector-api-classifier-preflight' && github.run_attempt == 1
    needs: candidate-build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
    - name: Set capture deadline before the job timeout
      run: echo "CLASSIFIER_CAPTURE_DEADLINE=$(( $(date +%s) + 100 * 60 ))" >> "$GITHUB_ENV"
      timeout-minutes: 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      timeout-minutes: 5
    - name: Check pinned authorized input metadata before compute
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        mkdir input-metadata
        for artifact_id in 11978661561 11981413932 11881672203 12015894519; do
          gh api "repos/re-thc/openjdk-jdk27u/actions/artifacts/$artifact_id" > "input-metadata/$artifact_id.json"
          python3 qualification/native_unroll/classifier_inputs.py metadata "input-metadata/$artifact_id.json" --artifact-id "$artifact_id"
        done
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38738016505
        artifact-ids: 11978661561
        path: historical-release
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38738016505
        artifact-ids: 11981413932
        path: historical-fastdebug
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38539204173
        artifact-ids: 11881672203
        path: saved
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38813879807
        artifact-ids: 12015894519
        path: jtreg
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        name: classifier-candidate-release
        path: candidate-release
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      with:
        name: classifier-candidate-fastdebug
        path: candidate-fastdebug
    - name: Verify independent candidate/control provenance and consumer bytes
      run: |-
        remaining=$(( CLASSIFIER_CAPTURE_DEADLINE - $(date +%s) ))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=30s "${remaining}s" bash -euo pipefail <<'CLASSIFIER_CAPTURE_BOUND'
        test "$(uname -m)" = aarch64
        mkdir bindings
        python3 qualification/native_unroll/classifier_inputs.py jtreg jtreg
        python3 qualification/native_unroll/classifier_inputs.py frozen saved/prior/frozen
        for level in release fastdebug; do
          python3 qualification/native_unroll/classifier_inputs.py extract "historical-$level/rebuilt-b3-jdk.tar.gz" "control-$level"
          python3 qualification/native_unroll/classifier_inputs.py extract "candidate-$level/classifier-jdk.tar.gz" "image-$level"
        done
        for level in release fastdebug; do
          python3 qualification/native_unroll/verify_classifier_images.py --candidate-built "candidate-$level" --candidate "image-$level/classifier-jdk" --historical-built "historical-$level" --control "control-$level/rebuilt-b3-jdk" --boot-built historical-release --boot-jdk control-release/rebuilt-b3-jdk --level "$level" > "bindings/$level.log" 2>&1
        done
        CLASSIFIER_CAPTURE_BOUND
      timeout-minutes: 101
    - name: Correctness and IR only; keep20minutes for capture
      run: |-
        remaining=$(( CLASSIFIER_CAPTURE_DEADLINE - $(date +%s) ))
        test "$remaining" -gt 0
        timeout --signal=TERM --kill-after=30s "${remaining}s" bash -euo pipefail <<'CLASSIFIER_CAPTURE_BOUND'
        remaining=$(( CLASSIFIER_CAPTURE_DEADLINE - $(date +%s) ))
        test "$remaining" -gt 0
        set +e
        timeout --signal=TERM --kill-after=30s "${remaining}s" python3 qualification/native_unroll/run_roundtrip_preflight.py --release-jdk image-release/classifier-jdk --debug-jdk image-fastdebug/classifier-jdk --control-jdk control-release/rebuilt-b3-jdk --control-debug-jdk control-fastdebug/rebuilt-b3-jdk --jtreg jtreg --frozen saved/prior/frozen --out preflight --historical-control --execute
        status=$?
        mkdir -p preflight
        printf '{"exit_status":%s,"job_retry":false}\n' "$status" > preflight/preflight-status.json
        exit "$status"
        CLASSIFIER_CAPTURE_BOUND
      timeout-minutes: 101
    - name: Export readable success/failure evidence
      if: always()
      run: python3 qualification/native_unroll/export_roundtrip_evidence.py preflight
      timeout-minutes: 3
    - name: Preserve preflight evidence before the120-minute cap
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: classifier-correctness-ir-preflight
        path: |-
          preflight
          bindings
          input-metadata
          qualification/native_unroll/classifier-provenance.json
        retention-days: 30
      timeout-minutes: 5
