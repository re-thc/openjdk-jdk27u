name: SIMDUTF C2 memory effects
on:
  push:
    branches: [review/simdutf-memory-effects]
permissions:
  contents: read
  actions: read
jobs:
  jtreg:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-jtreg
  measure:
    needs: jtreg
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x64
            cpu_flags: -march=x86-64-v3 -mtune=generic
          - runner: ubuntu-26.04-arm
            platform: linux-aarch64
            cpu_flags: -march=armv8.2-a -mtune=generic
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bundles-${{ matrix.platform }}
          run-id: 38492894363
          github-token: ${{ github.token }}
          path: bundles/head
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bundles-${{ matrix.platform }}
          run-id: 38448260341
          github-token: ${{ github.token }}
          path: bundles/base
      - uses: ./.github/actions/get-bootjdk
        id: boot
        with:
          platform: ${{ matrix.platform }}
      - uses: ./.github/actions/get-jtreg
        id: tests
      - name: Install matching mold linker
        run: |
          case "$(uname -m)" in
            x86_64) task_mold_sha=6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189 ;;
            aarch64) task_mold_sha=52c759d3689babaea4c42af2f31062a74ab83e17ffb5a8090232534c67b70577 ;;
            *) exit 1 ;;
          esac
          task_mold_archive="$RUNNER_TEMP/mold.tar.gz"
          curl --fail --location --retry 3 "https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-$(uname -m)-linux.tar.gz" --output "$task_mold_archive"
          echo "$task_mold_sha  $task_mold_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mold"
          tar --extract --file "$task_mold_archive" --strip-components=1 --directory "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
      - name: Build and verify candidate VM
        env:
          BOOT: ${{ steps.boot.outputs.path }}
          JTREG: ${{ steps.tests.outputs.path }}
          CPU_FLAGS: ${{ matrix.cpu_flags }}
        run: |
          set -e
          mkdir -p image/head image/base results jmh
          tar -xf bundles/head/jdk-${{ matrix.platform }}.tar.gz -C image/head
          tar -xf bundles/base/jdk-${{ matrix.platform }}.tar.gz -C image/base
          sudo apt-get update
          sudo apt-get install -y autoconf gcc-16 g++-16 mold libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev zip unzip
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16
          task_head_java=$(find image/head -path '*/bin/java' -print -quit)
          task_base_java=$(find image/base -path '*/bin/java' -print -quit)
          task_head_image=$(dirname "$(dirname "$task_head_java")")
          task_base_image=$(dirname "$(dirname "$task_base_java")")
          for task_level in release fastdebug; do
            bash configure --with-conf-name="$task_level" --with-debug-level="$task_level" --with-boot-jdk="$BOOT" --with-jtreg="$JTREG" --disable-desktop --enable-headless-only --enable-jvm-feature-serialgc --enable-jvm-feature-g1gc --enable-jvm-feature-zgc --disable-jvm-feature-epsilongc --disable-jvm-feature-parallelgc --disable-jvm-feature-shenandoahgc --with-extra-cflags="$CPU_FLAGS" --with-extra-cxxflags="$CPU_FLAGS" --with-extra-ldflags=-fuse-ld=mold --with-zlib=system --with-native-debug-symbols=none --disable-javac-server > "results/configure-$task_level.log" 2>&1 || { tail -100 "results/configure-$task_level.log"; exit 1; }
            make CONF="$task_level" JOBS=4 hotspot > "results/build-$task_level.log" 2>&1 || { tail -100 "results/build-$task_level.log"; exit 1; }
            cp -a "$task_head_image" "image/$task_level"
            task_jvm=$(find "build/$task_level" -name libjvm.so -print -quit)
            test -n "$task_jvm"
            cp "$task_jvm" "image/$task_level/lib/server/libjvm.so"
            bash "$JTREG/bin/jtreg" -jdk:"$GITHUB_WORKSPACE/image/$task_level" -agentvm -concurrency:2 -timeoutFactor:5 -javaoptions:-XX:ActiveProcessorCount=2 -vmoptions:-XX:ActiveProcessorCount=2 -w:"results/jtreg-$task_level-work" -r:"results/jtreg-$task_level-report" test/hotspot/jtreg/compiler/intrinsics/simdutf test/hotspot/jtreg/compiler/escapeAnalysis/TestSimdUTFLeaf.java > "results/jtreg-$task_level.log" 2>&1 || { tail -120 "results/jtreg-$task_level.log"; exit 1; }
          done
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar -o jmh/core.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar -o jmh/generator.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar -o jmh/options.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar -o jmh/math.jar
          python3 make/scripts/simdutf-memory-effects.py "$GITHUB_WORKSPACE/image/release" "$task_head_image" "$task_base_image" "$GITHUB_WORKSPACE/results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simdutf-memory-${{ matrix.platform }}
          path: results
          retention-days: 14
