name: 'Archive StringZilla native configuration evidence'

on:
  push:
    branches: ['codex/stringzilla-serial-equality-evidence']

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Archive completed native results'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/archive-stringzilla-native-equality.py
      - name: 'Publish evidence on this auxiliary branch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/stringzilla/measurements/serial-equality-investigation
          git commit -m 'Archive native serial equality samples, assembly and safety receipts'
          git push origin HEAD:refs/heads/codex/stringzilla-serial-equality-evidence
