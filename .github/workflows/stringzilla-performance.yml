name: StringZilla synchronized qualification

on:
  push:
    branches: [codex/stringzilla-synced-qualification]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.backend }} complete images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x64
            backend: avx2
          - runner: ubuntu-26.04
            platform: linux-x64
            backend: serial
          - runner: ubuntu-26.04-arm
            platform: linux-aarch64
            backend: neon
          - runner: windows-2025
            platform: windows-x64
            backend: msvc
    env:
      MSYS2_PATH_TYPE: minimal
      CHERE_INVOKING: 1
      CONFIGURE_DEV_NO_MOLD: 1

    steps:
      - name: Checkout measured fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 2550a2100281b5a6d6aa7a9310a9e6b047937e2c

      - name: Checkout untouched original
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 416d7db3ec3cf03d0e4b05f919dce6aa9f9b5eda
          path: baseline
          persist-credentials: false

      - name: Get MSYS2
        if: runner.os == 'Windows'
        uses: ./.github/actions/get-msys2
        with:
          architecture: x86.x64

      - name: Get boot JDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: ${{ matrix.platform }}

      - name: Restore verified JTReg 8.2.1
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, subprocess, zipfile
          from pathlib import Path, PurePosixPath

          endpoint = "repos/re-thc/openjdk-jdk27u/actions/artifacts/12111121678"
          artifact = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
          digest = "a44a66929557be2dc1b8e257ebdff1c1268aeab9894c4a239316c2cedf27fb49"
          assert artifact["id"] == 12111121678
          assert artifact["name"] == "bundles-jtreg-8.2.1+1"
          assert artifact["digest"] == "sha256:" + digest and not artifact["expired"]
          assert artifact["workflow_run"]["id"] == 39059898881
          assert "JTREG_VERSION=8.2.1+1" in Path("make/conf/github-actions.conf").read_text()
          archive = Path("jtreg-bundle.zip")
          with archive.open("wb") as output:
              subprocess.run(["gh", "api", endpoint + "/zip"], stdout=output, check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(archive) as bundle:
              assert all(not PurePosixPath(name).is_absolute() and ".." not in PurePosixPath(name).parts
                         for name in bundle.namelist())
              bundle.extractall("jtreg/installed")
          jar = Path("jtreg/installed/lib/jtreg.jar")
          assert jar.is_file()
          print("STRINGZILLA_JTREG_REUSE " + json.dumps({
              "artifact": artifact["id"], "producer_run": 39059898881,
              "zip_sha256": digest, "jar_sha256": hashlib.sha256(jar.read_bytes()).hexdigest()
          }), flush=True)

      - name: Record sources and vendoring
        shell: bash
        run: |
          mkdir -p perf-output
          git rev-parse HEAD > perf-output/source.txt
          git ls-tree HEAD -- src make test bin > perf-output/runtime-trees.txt
          python make/scripts/update-stringzilla.py --verify | tee perf-output/vendor-verification.log

      - name: Install GCC 16
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          test "$(gcc-16 -dumpversion)" = 16
          test "$(g++-16 -dumpversion)" = 16
          gcc-16 --version
          g++-16 --version

      - name: Build matched complete Linux images
        if: runner.os == 'Linux'
        shell: bash
        env:
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
          CC: gcc-16
          CXX: g++-16
        run: |
          mkdir -p perf-output perf-images perf-image-archives
          for control in original fork; do
            if [[ $control == original ]]; then source_dir=baseline; else source_dir=.; fi
            (
              cd "$source_dir"
              bash bin/configure-dev --with-conf-name=perf --with-debug-level=release \
                --with-boot-jdk="$BOOT_JDK" --with-version-opt=stringzilla-benchmark \
                --with-source-date=1792195200 --with-native-debug-symbols=none \
                --with-jmod-compress=zip-1
              make CONF=perf JOBS=2 images
            )
            cp "$source_dir/build/perf/spec.gmk" "perf-output/$control-spec.gmk"
            cp -a "$source_dir/build/perf/images/jdk" "perf-images/$control"
            bash .github/scripts/check-dev-profile.sh "perf-images/$control" "perf-output/$control-spec.gmk"
            cp "perf-output/$control-spec.gmk" "perf-image-archives/$control-spec.gmk"
            tar -czf "perf-image-archives/$control-jdk.tar.gz" -C perf-images "$control"
            sha256sum "perf-image-archives/$control-jdk.tar.gz" > "perf-image-archives/$control-jdk.tar.gz.sha256"
            rm -rf "$source_dir/build/perf"
          done

      - name: Check MSVC 14.44 toolset
        if: runner.os == 'Windows'
        id: msvc-check
        shell: bash
        run: |
          set +e
          '/c/Program Files/Microsoft Visual Studio/18/Enterprise/vc/auxiliary/build/vcvars64.bat' -vcvars_ver=14.44
          if [ $? -eq 0 ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install MSVC 14.44 toolset
        if: runner.os == 'Windows' && steps.msvc-check.outputs.installed != 'true'
        shell: bash
        run: |
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe' \
            modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\18\Enterprise' \
            --add Microsoft.VisualStudio.Component.VC.14.44.x86.x64

      - name: Build matched complete MSVC images
        if: runner.os == 'Windows'
        shell: env /usr/bin/bash --login -eo pipefail {0}
        env:
          PATH: ''
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
        run: |
          mkdir -p perf-output perf-images perf-image-archives
          for control in original fork; do
            if [[ $control == original ]]; then source_dir=baseline; else source_dir=.; fi
            (
              cd "$source_dir"
              bash bin/configure-dev --with-conf-name=perf --with-debug-level=release \
                --with-boot-jdk="$BOOT_JDK" --with-version-opt=stringzilla-benchmark \
                --with-source-date=1792195200 --with-native-debug-symbols=none \
                --with-toolchain-version=2026 --with-msvc-toolset-version=14.44 \
                --with-jmod-compress=zip-1
              make CONF=perf JOBS=2 images
            )
            spec="$source_dir/build/perf/spec.gmk"
            test "$(awk '$1 == "TOOLCHAIN_TYPE" { print $3 }' "$spec")" = microsoft
            test "$(awk '$1 == "TOOLCHAIN_VERSION" { print $3 }' "$spec")" = 2026
            for compiler in CC CXX; do
              version=$(awk -v key="${compiler}_VERSION_NUMBER" '$1 == key { print $3 }' "$spec")
              [[ $version == 19.44.* ]]
            done
            cp "$spec" "perf-output/$control-spec.gmk"
            cp -a "$source_dir/build/perf/images/jdk" "perf-images/$control"
            bash .github/scripts/check-dev-profile.sh "perf-images/$control" "perf-output/$control-spec.gmk"
            cp "perf-output/$control-spec.gmk" "perf-image-archives/$control-spec.gmk"
            tar -czf "perf-image-archives/$control-jdk.tar.gz" -C perf-images "$control"
            sha256sum "perf-image-archives/$control-jdk.tar.gz" > "perf-image-archives/$control-jdk.tar.gz.sha256"
            rm -rf "$source_dir/build/perf"
          done

      - name: Retain both complete images before validation and timing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringzilla-performance-images-${{ matrix.backend }}-${{ github.sha }}
          path: perf-image-archives
          if-no-files-found: error
          retention-days: 30

      - name: Run StringZilla jtreg smoke on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          perf-images/fork/bin/java -jar jtreg/installed/lib/jtreg.jar \
            -jdk:"$GITHUB_WORKSPACE/perf-images/fork" \
            -w:perf-output/jtreg-work -r:perf-output/jtreg-report \
            "-javaoption:-XX:ActiveProcessorCount=2" -verbose:summary \
            test/jdk/java/lang/String/StringZillaSearch.java \
            test/jdk/java/lang/String/StringZillaBounded.java 2>&1 | tee perf-output/jtreg.log
          perf-images/fork/bin/java -jar jtreg/installed/lib/jtreg.jar \
            -jdk:"$GITHUB_WORKSPACE/perf-images/fork" \
            -w:perf-output/jtreg-bounds-work -r:perf-output/jtreg-bounds-report \
            "-javaoption:-XX:ActiveProcessorCount=2" -verbose:summary \
            test/hotspot/jtreg/compiler/intrinsics/string/TestStringZillaUTF16Bounds.java \
            test/hotspot/jtreg/compiler/intrinsics/string/TestStringZillaDispatch.java \
            2>&1 | tee perf-output/jtreg-bounds.log

      - name: Run StringZilla jtreg smoke on MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jdk = (Resolve-Path perf-images/fork).Path
          $jtreg = (Resolve-Path jtreg/installed/lib/jtreg.jar).Path
          & "$jdk/bin/java.exe" -jar $jtreg "-jdk:$jdk" `
            -w:perf-output/jtreg-work -r:perf-output/jtreg-report `
            "-javaoption:-XX:ActiveProcessorCount=2" -verbose:summary `
            test/jdk/java/lang/String/StringZillaSearch.java `
            test/jdk/java/lang/String/StringZillaBounded.java 2>&1 |
              Tee-Object -FilePath perf-output/jtreg.log
          if ($LASTEXITCODE -ne 0) { throw 'StringZilla jtreg smoke failed' }
          & "$jdk/bin/java.exe" -jar $jtreg "-jdk:$jdk" `
            -w:perf-output/jtreg-bounds-work -r:perf-output/jtreg-bounds-report `
            "-javaoption:-XX:ActiveProcessorCount=2" -verbose:summary `
            test/hotspot/jtreg/compiler/intrinsics/string/TestStringZillaUTF16Bounds.java `
            test/hotspot/jtreg/compiler/intrinsics/string/TestStringZillaDispatch.java `
            2>&1 | Tee-Object -FilePath perf-output/jtreg-bounds.log
          if ($LASTEXITCODE -ne 0) { throw 'StringZilla physical bounds and dispatch jtreg tests failed' }

      - name: Build and execute native ASan and UBSan contract checks
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p perf-output/native-validation
          cat > perf-output/native-validation/driver.c <<'EOF'
          #include "test/jdk/java/lang/String/libStringZillaKernelsTest.c"
          #include <stdio.h>
          int main(void) {
              for (jint mask = 0; mask < 8; mask++) {
                  requested_capabilities = mask;
                  test_initialize();
                  printf("requested=%d selected=%d executable=%d\n",
                         mask, published->capabilities, can_execute(published->capabilities));
              }
              int failure = check_kernels();
              if (failure != 0) {
                  fprintf(stderr, "Native kernel check failed at line %d\n", failure);
                  return 1;
              }
              puts("StringZilla production native kernel checks passed");
              return 0;
          }
          EOF
          native_compile=(gcc-16 -std=c11 -O2 -g -fno-omit-frame-pointer
            -fsanitize=address,undefined,alignment -fno-sanitize-recover=all
            -Wno-unknown-pragmas
            "-I$GITHUB_WORKSPACE"
            "-I$GITHUB_WORKSPACE/src/java.base/share/native/libjava"
            "-I$GITHUB_WORKSPACE/src/java.base/share/native/libjava/stringzilla"
            "-I$GITHUB_WORKSPACE/src/hotspot/share/include"
            "-I$GITHUB_WORKSPACE/src/hotspot/os/posix/include"
            "-I$GITHUB_WORKSPACE/perf-images/fork/include"
            "-I$GITHUB_WORKSPACE/perf-images/fork/include/linux"
            perf-output/native-validation/driver.c
            -o perf-output/native-validation/native-sanitizers)
          printf '%q ' "${native_compile[@]}" > perf-output/native-validation/compile-command.txt
          printf '\n' >> perf-output/native-validation/compile-command.txt
          "${native_compile[@]}" 2>&1 | tee perf-output/native-validation/build.log
          perf-output/native-validation/native-sanitizers 2>&1 |
            tee perf-output/native-validation/run.log
          git diff --exit-code -- src make test

      - name: Measure Linux original, enabled and disabled
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python .github/scripts/stringzilla-performance.py
          --original perf-images/original --fork perf-images/fork
          --original-source baseline --fork-source .
          --output perf-output --backend ${{ matrix.backend }}
          --manifest doc/stringzilla/native-cases.tsv

      - name: Measure MSVC original, enabled and disabled
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python .github/scripts/stringzilla-performance.py
          --original perf-images/original --fork perf-images/fork
          --original-source baseline --fork-source .
          --output perf-output --backend ${{ matrix.backend }}
          --manifest doc/stringzilla/native-cases.tsv

      - name: Retain raw results and build provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringzilla-performance-results-${{ matrix.backend }}-${{ github.sha }}
          path: perf-output
          if-no-files-found: warn
          retention-days: 30
