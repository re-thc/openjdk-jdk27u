name: Preserve exact final StringZilla benchmark files
on:
  push:
    branches: [codex/stringzilla-final-saved-files]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bindings:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.proof.outputs.matrix }}
      copy_needed: ${{ steps.stop.outputs.copy_needed }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          sparse-checkout: .github/scripts
      - id: stop
        name: Preserve completed exports and stop only the two queued readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stringzilla-final-saved-predecessor.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stringzilla-final-saved-predecessor-${{ github.sha }}
          path: saved-predecessor.json
          if-no-files-found: error
          retention-days: 30
      - name: Check saved-byte transport without a JVM
        run: |
          python3 -m py_compile .github/scripts/stringzilla-final-saved-files.py .github/scripts/stringzilla-final-saved-files-test.py .github/scripts/stringzilla-raw-jmh.py .github/scripts/stringzilla-final-sky-election.py .github/scripts/single-host-validation/stringzilla-single-sky.py .github/scripts/single-host-validation/stringzilla-final.py
          python3 .github/scripts/stringzilla-final-saved-files-test.py .github/scripts/stringzilla-final-saved-files.py
      - id: proof
        name: Verify immutable projections and only the selected completed archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stringzilla-final-saved-files.py proof
  export:
    needs: bindings
    if: needs.bindings.outputs.copy_needed == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bindings.outputs.matrix) }}
    name: Preserve original ${{ matrix.id }} JSON files
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          sparse-checkout: .github/scripts
      - name: Authenticate and copy existing saved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stringzilla-final-saved-files.py read --index ${{ matrix.index }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stringzilla-final-saved-files-${{ matrix.id }}-${{ github.sha }}
          path: evidence-output
          if-no-files-found: error
          retention-days: 30
