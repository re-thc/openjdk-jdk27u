name: Preserve completed normal StringZilla benchmark files
on:
  push:
    branches: [codex/stringzilla-final-saved-next]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    name: Preserve 1500 completed normal comparisons
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          sparse-checkout: .github/scripts
      - name: Check saved-byte transport without a JVM
        run: |
          python3 -m py_compile .github/scripts/stringzilla-final-saved-files.py .github/scripts/stringzilla-final-saved-files-test.py .github/scripts/stringzilla-raw-jmh.py .github/scripts/stringzilla-final-sky-election.py .github/scripts/single-host-validation/stringzilla-single-sky.py .github/scripts/single-host-validation/stringzilla-final.py
          python3 .github/scripts/stringzilla-final-saved-files-test.py .github/scripts/stringzilla-final-saved-files.py
      - id: proof
        name: Verify twelve disjoint completed archive bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stringzilla-final-saved-files.py proof
      - name: Authenticate and copy each archive once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          script = root / ".github/scripts/stringzilla-final-saved-files.py"
          pins = json.loads((script.parent / "stringzilla-final-saved-cases.json").read_bytes())
          cases = pins["cases"]
          assert len(cases) == 12
          assert {case["backend"] for case in cases} == {"serial", "avx2", "neon", "msvc"}
          assert {case["tier"] for case in cases} == {"interpreter", "c1", "c2"}
          assert len({(case["backend"], case["tier"]) for case in cases}) == 12
          assert sum(case["strict_validation"]["triplets"] for case in cases) == 1500
          folder = root / "saved-files"
          folder.mkdir()
          for index, case in enumerate(cases):
              destination = folder / case["id"]
              destination.mkdir()
              subprocess.run([sys.executable, str(script), "read", "--index", str(index)],
                             cwd=destination, check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stringzilla-final-saved-normal-${{ github.sha }}
          path: saved-files
          if-no-files-found: error
          retention-days: 30
