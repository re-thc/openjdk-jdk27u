name: PR9 ARM fastdebug build identity only
on:
  workflow_call:
    inputs:
      workflow-source-sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-linux:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow-source-sha }}
      EXPECTED_SOURCE: e41d7823bf6de77c4bfba52e896bf325221488cb
      EXPECTED_SOURCE_TREE: 74266b06937f4983e513ee058e8f43ea01dc914d
      EXPECTED_BUNDLE_CHECKPOINT: c158ea6ba18667c2e71127e9b1bb8b9b760f3fbd
      EXPECTED_BUNDLE_SHA256: 79f0619e2fe9cf1b26b9526c615ce56c1d5b60082aa389c511098c9354ff1ed9
    steps:
      - name: Checkout the separately pinned workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.workflow-source-sha }}
          path: pr9-workflow
          persist-credentials: false

      - name: Capture and verify workflow identity before source restoration
        shell: bash
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/pr9-identity"
          mkdir -p "$identity/workflow-definition"
          trap 'rc=$?; printf "exit_code=%s\n" "$rc" > "$identity/workflow-validation-status.txt"; trap - EXIT; exit "$rc"' EXIT
          printf '%s\n' "$EXPECTED_WORKFLOW_SHA" > "$identity/workflow-source-expected.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > "$identity/workflow-source.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > "$identity/workflow-ref.txt"
          printf '%s\n' "$GITHUB_SHA" > "$identity/event-source.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$identity/workflow-run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$identity/workflow-run-attempt.txt"
          git -C pr9-workflow rev-parse HEAD > "$identity/workflow-checkout-source.txt"
          git -C pr9-workflow rev-parse 'HEAD^{tree}' > "$identity/workflow-checkout-tree.txt"
          git -C pr9-workflow status --porcelain=v1 > "$identity/workflow-checkout-status.txt"
          cp pr9-workflow/.github/workflows/main.yml pr9-workflow/.github/workflows/pr9-native-linux.yml "$identity/workflow-definition/"
          sha256sum "$identity/workflow-definition/"*.yml > "$identity/workflow-definition-sha256.txt"
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(cat "$identity/workflow-checkout-source.txt")" = "$EXPECTED_WORKFLOW_SHA"
          test ! -s "$identity/workflow-checkout-status.txt"
          test ! -e "$RUNNER_TEMP/pr9-workflow"
          mv pr9-workflow "$RUNNER_TEMP/pr9-workflow"

      - name: Checkout the public candidate prerequisite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c04d1ba1e96b2176ce8a8e56eacae73c2d356d2b
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable candidate bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c158ea6ba18667c2e71127e9b1bb8b9b760f3fbd
          path: pr9-source-bootstrap
          sparse-checkout: .github/qualification/chain-checkpoint/layout-source-e41d
          persist-credentials: false

      - name: Restore and verify exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/pr9-identity"
          bootstrap="$RUNNER_TEMP/pr9-source-bootstrap"
          test ! -e "$bootstrap"
          mv pr9-source-bootstrap "$bootstrap"
          bundle="$bootstrap/.github/qualification/chain-checkpoint/layout-source-e41d/layout-source.bundle"
          printf '%s\n' "$EXPECTED_SOURCE" > "$identity/candidate-source-expected.txt"
          printf '%s\n' "$EXPECTED_SOURCE_TREE" > "$identity/candidate-tree-expected.txt"
          printf '%s\n' "$EXPECTED_BUNDLE_CHECKPOINT" > "$identity/bundle-checkpoint-expected.txt"
          printf '%s\n' "$EXPECTED_BUNDLE_SHA256" > "$identity/bundle-sha256-expected.txt"
          git -C "$bootstrap" rev-parse HEAD > "$identity/bundle-checkpoint-actual.txt"
          sha256sum "$bundle" > "$identity/bundle-sha256-actual.txt"
          test "$(cat "$identity/bundle-checkpoint-actual.txt")" = "$EXPECTED_BUNDLE_CHECKPOINT"
          echo "79f0619e2fe9cf1b26b9526c615ce56c1d5b60082aa389c511098c9354ff1ed9  $bundle" | sha256sum --check
          git bundle verify "$bundle" > "$identity/bundle-verify.txt" 2>&1
          git -c gc.auto=0 -c maintenance.auto=false fetch "$bundle" refs/heads/common-intrinsics:refs/remotes/qualification/candidate
          git checkout --detach e41d7823bf6de77c4bfba52e896bf325221488cb
          git rev-parse HEAD > "$identity/restored-source.txt"
          git rev-parse 'HEAD^{tree}' > "$identity/restored-tree.txt"
          git status --porcelain=v1 > "$identity/restored-status.txt"
          test "$(cat "$identity/restored-source.txt")" = e41d7823bf6de77c4bfba52e896bf325221488cb
          test "$(cat "$identity/restored-tree.txt")" = 74266b06937f4983e513ee058e8f43ea01dc914d
          test ! -s "$identity/restored-status.txt"

      - name: Get the BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-aarch64

      - name: Get GTest build dependency without executing tests
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: Install native toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt update
          sudo apt install --only-upgrade apt
          sudo apt install gcc-16 g++-16 ccache
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16

      - name: Install pinned ARM mold 3.0.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mold.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-aarch64-linux.tar.gz \
            --output "$archive"
          echo "52c759d3689babaea4c42af2f31062a74ab83e17ffb5a8090232534c67b70577  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mold"
          tar --extract --file "$archive" --strip-components=1 --directory "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/pr9-identity"
          gcc --version > "$identity/gcc-version.txt"
          g++ --version > "$identity/gxx-version.txt"
          mold --version > "$identity/mold-version.txt"
          test "$(gcc -dumpversion)" = 16
          test "$(g++ -dumpversion)" = 16

      - name: Restore compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          platform: linux-aarch64
          debug-level: debug
          toolchain: gcc-16

      - name: Configure one fastdebug image with at most two build workers and no archives
        shell: bash
        env:
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
          GTEST: ${{ steps.gtest.outputs.path }}
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/pr9-identity"
          args=(
            --with-conf-name=linux-aarch64
            --with-debug-level=fastdebug
            --with-jobs=2 --with-num-cores=2
            --disable-cds-archive --disable-cds-archive-nocoh
            "--with-version-opt=pr9-identity-$GITHUB_WORKFLOW_SHA"
            "--with-boot-jdk=$BOOT_JDK" "--with-gtest=$GTEST"
            --with-zlib=system --with-jmod-compress=zip-1
            --with-external-symbols-in-bundles=none
            --with-native-debug-symbols-level=1
          )
          printf '%q ' bash bin/configure-dev "${args[@]}" > "$identity/configure-command.txt"
          printf '\n' >> "$identity/configure-command.txt"
          bash bin/configure-dev "${args[@]}" 2>&1 | tee "$identity/configure-stdout.txt"

      - name: Enforce native fastdebug worker and archive-generation limits before build
        shell: bash
        run: |
          set -euo pipefail
          spec=build/linux-aarch64/spec.gmk
          test "$(uname -m)" = aarch64
          grep -E '^DEBUG_LEVEL *:= *fastdebug$' "$spec"
          grep -E '^OPENJDK_TARGET_CPU *:= *aarch64$' "$spec"
          grep -E '^JOBS *:= *2$' "$spec"
          grep -E '^NUM_CORES *:= *2$' "$spec"
          grep -E '^BUILD_CDS_ARCHIVE *:= *false$' "$spec"
          grep -E '^BUILD_CDS_ARCHIVE_NOCOH *:= *false$' "$spec"

      - name: Build product bundles only with two workers
        id: build
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/pr9-identity"
          trap 'rc=$?; printf "exit_code=%s\n" "$rc" > "$identity/build-status.txt"; trap - EXIT; exit "$rc"' EXIT
          printf '%s\n' 'timeout --signal=TERM --kill-after=30s 40m make CONF=linux-aarch64 JOBS=2 LOG=info product-bundles' > "$identity/build-command.txt"
          timeout --signal=TERM --kill-after=30s 40m \
            make CONF=linux-aarch64 JOBS=2 LOG=info product-bundles \
            2>&1 | tee "$identity/build-stdout.txt"

      - name: Capture complete identity before strict source assertions
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/pr9-identity"
          mkdir -p "$identity/configuration"
          image=build/linux-aarch64/images/jdk
          stage=capture
          trap 'rc=$?; printf "stage=%s\nexit_code=%s\n" "$stage" "$rc" > "$identity/source-validation-status.txt"; trap - EXIT; exit "$rc"' EXIT
          # Refresh all identity inputs before either original strict assertion.
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > "$identity/workflow-source.txt"
          printf '%s\n' "$EXPECTED_WORKFLOW_SHA" > "$identity/workflow-source-expected.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > "$identity/workflow-ref.txt"
          printf '%s\n' "$GITHUB_SHA" > "$identity/event-source.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$identity/workflow-run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$identity/workflow-run-attempt.txt"
          git rev-parse HEAD | tee "$identity/checkout-source.txt"
          git rev-parse 'HEAD^{tree}' > "$identity/checkout-tree.txt"
          git status --porcelain=v1 > "$identity/git-status.txt"
          # A failed optional capture does not prevent the remaining captures.
          capture_rc=0
          git -C gtest rev-parse HEAD > "$identity/gtest-source.txt" || capture_rc=1
          git -C gtest status --porcelain=v1 > "$identity/gtest-status.txt" || capture_rc=1
          cp "$BOOT_JDK/release" "$identity/bootjdk-release" || capture_rc=1
          sha256sum "$identity/bootjdk-release" > "$identity/bootjdk-release-sha256.txt" || capture_rc=1
          for file in spec.gmk configure.log config.log; do
            if test -f "build/linux-aarch64/$file"; then
              cp "build/linux-aarch64/$file" "$identity/configuration/$file" || capture_rc=1
            fi
          done
          if test -f config.log; then
            cp config.log "$identity/configuration/top-config.log" || capture_rc=1
          fi
          cp "$image/release" "$identity/release" || capture_rc=1
          sed -n '/^SOURCE=/p' "$image/release" | tee "$identity/source-line.txt" || capture_rc=1
          find "$image" -type f \( -name libjvm.so -o -name modules -o -name 'classes*.jsa' -o -name release -o -path '*/bin/java' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > "$identity/payload-sha256.txt" || capture_rc=1
          for file in bin/java lib/server/libjvm.so lib/modules release; do
            test -s "$image/$file" || capture_rc=1
          done
          find "$image" -type f -name '*.jsa' -print > "$identity/archive-files.txt" || capture_rc=1
          find build/linux-aarch64/bundles -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 -r sha256sum > "$identity/bundle-payload-sha256.txt" || capture_rc=1
          find "$identity/configuration" -type f -print0 \
            | sort -z | xargs -0 -r sha256sum > "$identity/configuration-sha256.txt" || capture_rc=1
          timeout --signal=TERM --kill-after=5s 30s "$image/bin/java" \
            -Xshare:off -XX:ActiveProcessorCount=1 -version \
            > "$identity/java-version.txt" 2>&1 || capture_rc=1
          printf '%s\n' "$capture_rc" > "$identity/capture-exit-code.txt"
          # Do not replace these with a relaxed SOURCE parser or success fallback.
          stage=strict-checkout
          set -x
          test "$(git rev-parse HEAD)" = e41d7823bf6de77c4bfba52e896bf325221488cb
          stage=strict-release-source
          grep -Fx 'SOURCE=".:git:e41d7823bf6d"' "$image/release"
          set +x
          stage=complete-identity-checks
          test "$(cat "$identity/checkout-tree.txt")" = 74266b06937f4983e513ee058e8f43ea01dc914d
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test -f "$identity/configuration/spec.gmk"
          test -s "$identity/payload-sha256.txt"
          test -s "$identity/bundle-payload-sha256.txt"
          test ! -s "$identity/archive-files.txt"
          test "$capture_rc" = 0

      - name: Preserve identity receipt even when a strict assertion fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr9-native-identity-linux-aarch64-fastdebug
          path: ${{ runner.temp }}/pr9-identity
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve built bundles as unverified regardless of strict assertion result
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr9-native-unverified-bundles-linux-aarch64-fastdebug
          path: build/linux-aarch64/bundles/*
          if-no-files-found: error
          retention-days: 14
