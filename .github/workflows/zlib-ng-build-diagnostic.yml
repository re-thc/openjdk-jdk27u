name: zlib-ng GCC 16 build diagnosis

on:
  push:
    branches: [pr/zlib-ng-build-diagnostic]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x64
          - runner: ubuntu-26.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/get-bootjdk
        id: boot
        with:
          platform: ${{ matrix.platform }}
      - name: Install target compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-16 g++-16 ccache
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16
      - name: Install upstream linker
        run: |
          curl --fail --location --retry 3 "https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-$(uname -m)-linux.tar.gz" -o "$RUNNER_TEMP/mold.tar.gz"
          mkdir -p "$RUNNER_TEMP/mold"
          tar xf "$RUNNER_TEMP/mold.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
      - name: Configure target and build native archive
        run: |
          mkdir -p validation/sysroot/usr
          cp -a /usr/include validation/sysroot/usr/
          ln -s /usr/lib validation/sysroot/usr/lib
          ln -s /lib validation/sysroot/lib
          ln -s /lib64 validation/sysroot/lib64
          echo '#define ZIP_SYSROOT_PROBE 1' > validation/sysroot/usr/include/zip_sysroot_probe.h
          bash bin/configure-dev --with-conf-name=probe --with-boot-jdk=${{ steps.boot.outputs.path }} --with-zlib=system --with-native-debug-symbols=none --with-sysroot="$PWD/validation/sysroot"
          echo 'CFLAGS_JDKLIB += -include zip_sysroot_probe.h' >> build/probe/spec.gmk
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('make/modules/java.base/lib/CoreLibraries.gmk').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if '$(ZLIBNG_LIB):' in line)
          end = next(i for i in range(start, len(lines)) if 'LIBZIP_ZLIBNG_CFLAGS :=' in lines[i])
          recipes = [line for line in lines[start:end] if line.startswith('\t')]
          Path('probe.gmk').write_text("include $(SPEC)\nZLIBNG_SRC := $(TOPDIR)/src/java.base/share/native/libzip/zlib-ng\nZLIBNG_OUT := $(SUPPORT_OUTPUTDIR)/native/zlib-ng\nprobe:\n" + "\n".join(recipes) + "\n")
          PYCODE
          make -f probe.gmk SPEC="$PWD/build/probe/spec.gmk" probe
          grep -- '-include zip_sysroot_probe.h' build/probe/support/native/zlib-ng/Makefile
          grep -- "$PWD/validation/sysroot" build/probe/support/native/zlib-ng/Makefile
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-probe-${{ matrix.platform }}
          path: |
            build/probe/spec.gmk
            build/probe/support/native/zlib-ng/*.log
