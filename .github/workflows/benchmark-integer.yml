name: 'Benchmark integer conversions'

on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: linux-aarch64
      runs-on:
        type: string
        default: ubuntu-26.04-arm
      checks-only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Get release bundles'
        id: bundles
        uses: ./.github/actions/get-bundles
        with:
          platform: ${{ inputs.platform }}

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Measure native and Java integer conversions'
        if: runner.os != 'Windows'
        env:
          JDK_IMAGE: ${{ steps.bundles.outputs.jdk-path }}
          JTREG: ${{ steps.jtreg.outputs.path }}
          CHECKS_ONLY: ${{ inputs.checks-only }}
        run: |
          args=()
          if [[ "$CHECKS_ONLY" == true ]]; then args+=(--checks-only); fi
          python3 make/scripts/benchmark-decimal-integer.py \
          "$JDK_IMAGE" "$RUNNER_TEMP/integer-benchmarks" \
          --jtreg "$JTREG" "${args[@]}"

      - name: 'Measure native and Java integer conversions on Windows'
        if: runner.os == 'Windows'
        env:
          JDK_IMAGE: ${{ steps.bundles.outputs.jdk-path }}
          JTREG: ${{ steps.jtreg.outputs.path }}
          CHECKS_ONLY: ${{ inputs.checks-only }}
        run: |
          args=()
          if [[ "$CHECKS_ONLY" == true ]]; then args+=(--checks-only); fi
          python make/scripts/benchmark-decimal-integer.py \
          "$(cygpath -w "$JDK_IMAGE")" \
          "$(cygpath -w "$RUNNER_TEMP/integer-benchmarks")" \
          --jtreg "$(cygpath -w "$JTREG")" "${args[@]}"

      - name: 'Upload samples, commands and image hashes'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integer-benchmarks-${{ inputs.platform }}
          path: ${{ runner.temp }}/integer-benchmarks
          if-no-files-found: error
