name: 'Build (linux)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: 'ubuntu-26.04'
      bootjdk-platform:
        required: false
        type: string
        default: 'linux-x64'
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'product-bundles test-bundles'
      debug-levels:
        required: false
        type: string
        default: '[ "debug", "release" ]'
      gcc-version:
        required: true
        type: string
      apt-architecture:
        required: false
        type: string
      apt-extra-packages:
        required: false
        type: string
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      bundle-suffix:
        required: false
        type: string
      static-suffix:
        required: false
        type: string

jobs:
  build-linux:
    name: build
    runs-on: ${{ inputs.runs-on }}

    strategy:
      matrix:
        debug-level: ${{ fromJSON(inputs.debug-levels) }}

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: ${{ inputs.bootjdk-platform }}

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Set architecture'
        id: arch
        run: |
          # Set a proper suffix for packages if using a different architecture
          if [[ '${{ inputs.apt-architecture }}' != '' ]]; then
            echo 'suffix=:${{ inputs.apt-architecture }}' >> "$GITHUB_OUTPUT"
          fi

      # Upgrading apt to solve libc6 installation bugs, see JDK-8260460.
      - name: 'Install dependencies'
        run: |
          # Install dependencies using apt-get
          if [[ '${{ inputs.apt-architecture }}' != '' ]]; then
            sudo dpkg --add-architecture ${{ inputs.apt-architecture }}
          fi
          sudo apt update
          sudo apt install --only-upgrade apt
          sudo apt install \
            ccache \
            ${{ inputs.apt-extra-packages }}

      - name: 'Install released GCC'
        id: gcc
        run: bash .github/scripts/install-gcc.sh '${{ inputs.gcc-version }}' "$RUNNER_TEMP/gcc"

      - name: 'Install mold 3.0.0'
        run: |
          # Ubuntu's older mold cannot read GCC 16's AS_NEEDED linker script.
          case "$(uname -m)" in
            x86_64) checksum=6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189 ;;
            aarch64) checksum=52c759d3689babaea4c42af2f31062a74ab83e17ffb5a8090232534c67b70577 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/mold.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-$(uname -m)-linux.tar.gz" \
            --output "$archive"
          echo "$checksum  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mold"
          tar --extract --file "$archive" --strip-components=1 --directory "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"

      - name: 'Restore compiler cache'
        uses: ./.github/actions/compiler-cache
        with:
          platform: ${{ inputs.platform }}
          debug-level: ${{ matrix.debug-level }}
          toolchain: ${{ steps.gcc.outputs.identity }}

      - name: 'Configure'
        env:
          CC: ${{ steps.gcc.outputs.path }}/gcc
          CXX: ${{ steps.gcc.outputs.path }}/g++
        run: >
          bash bin/configure-dev
          --with-conf-name=${{ inputs.platform }}
          --with-toolchain-path=${{ steps.gcc.outputs.path }}
          --with-sysroot=/
          --with-extra-ldflags=-specs=builtin.specs
          ${{ matrix.debug-level == 'debug' && '--with-debug-level=fastdebug' || '' }}
          --with-version-opt="${GITHUB_ACTOR}-${GITHUB_SHA}"
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-jtreg=${{ steps.jtreg.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-zlib=system
          --with-jmod-compress=zip-1
          --with-external-symbols-in-bundles=none
          --with-native-debug-symbols-level=1
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)

      - name: 'Check configured GCC selection'
        env:
          GCC_BIN: ${{ steps.gcc.outputs.path }}
          GCC_VERSION: ${{ inputs.gcc-version }}
        run: |
          spec="build/${{ inputs.platform }}/spec.gmk"
          test "$(sed -n 's/^CC_VERSION_NUMBER := //p' "$spec")" = "$GCC_VERSION"
          test "$(sed -n 's/^CXX_VERSION_NUMBER := //p' "$spec")" = "$GCC_VERSION"
          cc=$(sed -n 's/^CC := *//p' "$spec")
          cxx=$(sed -n 's/^CXX := *//p' "$spec")
          test "${cc##* }" = "$GCC_BIN/gcc"
          test "${cxx##* }" = "$GCC_BIN/g++"
          test "$(sed -n 's/^SYSROOT := //p' "$spec")" = /
          mold --version

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          debug-suffix: "${{ matrix.debug-level == 'debug' && '-debug' || '' }}"
        if: ${{ inputs.dry-run == false }}

      - name: 'Check GCC runtime paths'
        run: |
          image="build/${{ inputs.platform }}/images/jdk"
          test -d "$image"
          while IFS= read -r -d '' artifact; do
            if readelf --file-header "$artifact" > /dev/null 2>&1; then
              dynamic=$(readelf --dynamic "$artifact")
              if grep -F "$RUNNER_TEMP/gcc" <<< "$dynamic"; then
                echo "JDK artifact embeds the temporary GCC install path: $artifact" >&2
                exit 1
              fi
            fi
          done < <(find "$image" -type f -print0)
        if: ${{ inputs.dry-run == false }}

      - name: 'Check development profile'
        run: bash .github/scripts/check-dev-profile.sh "build/${{ inputs.platform }}/images/jdk" "build/${{ inputs.platform }}/spec.gmk"
        if: ${{ inputs.dry-run == false }}

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: "${{ matrix.debug-level == 'debug' && '-debug' || '' }}"
          bundle-suffix: ${{ inputs.bundle-suffix }}
          static-suffix: ${{ inputs.static-suffix }}
        if: ${{ inputs.dry-run == false }}

      - name: 'Compiler cache statistics'
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() }}
