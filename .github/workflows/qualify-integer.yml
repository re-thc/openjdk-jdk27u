name: 'Qualify native integer conversions'

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/qualify-integer.yml
      - .github/workflows/benchmark-integer.yml
      - make/scripts/benchmark-decimal-integer.py
      - test/micro/org/openjdk/bench/java/lang/DecimalIntegerConversion.java

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - uses: ./.github/actions/build-jtreg

  build-macos:
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      platform: macos-aarch64
      runs-on: macos-26
      xcode-toolset-version: '26.6'
      debug-levels: '[ "release" ]'

  build-windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-x64
      runs-on: windows-2025
      architecture: 'x86.x64'
      msvc-toolset-version: '14.44'
      debug-levels: '[ "release" ]'

  benchmark-macos:
    needs: build-macos
    uses: ./.github/workflows/benchmark-integer.yml
    with:
      platform: macos-aarch64
      runs-on: macos-26

  benchmark-windows:
    needs: build-windows
    uses: ./.github/workflows/benchmark-integer.yml
    with:
      platform: windows-x64
      runs-on: windows-2025
