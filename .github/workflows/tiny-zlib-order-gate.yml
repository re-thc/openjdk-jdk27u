name: Fixed zlib order calibration and conditional tiny study
on:
  push:
    branches: [diagnostic/tiny-zlib-order-gate-20261015]
    paths:
      - .github/scripts/level-study/order-*
      - .github/workflows/tiny-zlib-order-gate.yml
permissions:
  contents: read
concurrency:
  group: zlib-order-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-gated-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: production
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts/level-study
            src/java.base/share/native/libzip
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9870d54525f8f5a1315da6f2f9b289fb535e26a3
          path: corpora
          sparse-checkout: |
            src/java.base/share/classes/java/util
            src/hotspot/share/runtime
            doc
          persist-credentials: false
      - name: Compiler prerequisites
        run: |
          if ! command -v gcc-14 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gcc-14 make python3
          fi
      - name: One fixed calibration and strictly conditional tiny comparison
        run: python3 production/.github/scripts/level-study/order-study.py --root production --corpora corpora --out validation/order
      - name: Retain summary
        if: always()
        run: |
          if test -f validation/order/REPORT.md; then
            cat validation/order/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: zlib-order-evidence-${{ github.run_id }}
          path: validation/order
          retention-days: 30
          if-no-files-found: error
  export-completed-evidence:
    needs: fixed-gated-study
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/scripts/level-study/order-score.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read completed evidence only
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PART: ${{ matrix.part }}
        run: python3 .github/scripts/level-study/order-score.py
