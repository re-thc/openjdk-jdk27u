name: 'StringZilla portable serial equality refinement'

on:
  push:
    branches: ['codex/stringzilla-serial-equality-refinement-da3ae24']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serial-equality:
    name: '${{ matrix.compiler }} native ${{ matrix.platform }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
            machine: x86_64
            compiler: gcc-16
            packages: gcc-16
          - platform: linux-x64
            runner: ubuntu-26.04
            machine: x86_64
            compiler: clang
            packages: clang libclang-rt-dev
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
            machine: aarch64
            compiler: gcc-16
            packages: gcc-16
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
            machine: aarch64
            compiler: clang
            packages: clang libclang-rt-dev
    steps:
      - name: 'Checkout the isolated experiment'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3

      - name: 'Record source and host'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serial-equality-output
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(git hash-object src/java.base/share/native/libjava/StringZillaKernels.c)" = 993fd1957118b4d45dee801a1977c15c3d982570
          git rev-parse HEAD > serial-equality-output/experiment-commit.txt
          git ls-tree -r HEAD -- src/java.base/share/native/libjava/StringZillaKernels.c \
            src/java.base/share/native/libjava/StringZillaKernels.h \
            src/java.base/share/native/libjava/stringzilla \
            test/jdk/java/lang/String/libStringZillaKernelsTest.c \
            .github/scripts/stringzilla-serial-equality.py \
            > serial-equality-output/source-blobs.txt
          lscpu > serial-equality-output/cpu.txt
          uname -a > serial-equality-output/host.txt
          python3 make/scripts/update-stringzilla.py --verify
          tar -czf serial-equality-output/sources.tar.gz \
            src/java.base/share/native/libjava/StringZillaKernels.c \
            src/java.base/share/native/libjava/StringZillaKernels.h \
            src/java.base/share/native/libjava/stringzilla \
            test/jdk/java/lang/String/libStringZillaKernelsTest.c \
            src/hotspot/share/include src/hotspot/os/posix/include/jvm_md.h

      - name: 'Get JNI headers'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: ${{ matrix.platform }}

      - name: 'Install the native compiler'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}
          ${{ matrix.compiler }} --version

      - name: 'Compare current and patched portable equality'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum '${{ steps.bootjdk.outputs.path }}/include/jni.h' \
            '${{ steps.bootjdk.outputs.path }}/include/linux/jni_md.h' \
            > serial-equality-output/jni-header-sha256.txt
          python3 .github/scripts/stringzilla-serial-equality.py \
            --compiler '${{ matrix.compiler }}' \
            --boot-jdk '${{ steps.bootjdk.outputs.path }}' \
            2>&1 | tee serial-equality-experiment.log
          sha256sum serial-equality-experiment.log > serial-equality-output/experiment-log-sha256.txt

      - name: 'Upload every native sample and validation artifact'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringzilla-serial-equality-${{ matrix.platform }}-${{ matrix.compiler }}
          path: |
            serial-equality-output
            serial-equality-experiment.log
          if-no-files-found: error
          retention-days: 14
