name: StringZilla final paired native checks
# Bounded dispatch corrections: reused verified complete controls, one new build per platform.
# Five complete-image controls, five balanced rounds, five samples per fork.
on:
  push:
    branches: [codex/stringzilla-final-artifacts]
    paths: [.github/workflows/stringzilla-paired-final.yml]
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: stringzilla-merge-20261022
  cancel-in-progress: true
jobs:
  neon:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 15da3c455ba3f15993f581150c775bb7a941fccd
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .stringzilla-driver
          persist-credentials: false
          sparse-checkout: doc/stringzilla/merge-20261022
      - name: Restore verified independent native ARM baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .stringzilla-driver/doc/stringzilla/merge-20261022/prepare.py restore --backend neon
      - uses: ./.github/actions/get-bootjdk
        id: bootjdk
        with:
          platform: linux-aarch64
      - name: Install matching GCC 16
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
      - name: Restore verified matched master image
        run: python3 .stringzilla-driver/doc/stringzilla/merge-20261022/restore-master.py --backend neon
      - name: Build complete native ARM candidate
        env:
          CC: gcc-16
          CXX: g++-16
          CONFIGURE_DEV_NO_MOLD: '1'
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
        run: |
          bash bin/configure-dev --with-conf-name=perf --with-debug-level=release \
            --with-boot-jdk="$BOOT_JDK" --with-version-opt=stringzilla-benchmark --with-version-pre=internal \
            --with-source-date=1792195200 --with-native-debug-symbols=none --with-jmod-compress=zip-1
          make CONF=perf JOBS=2 images
          python3 .stringzilla-driver/doc/stringzilla/merge-20261022/prepare.py seal --backend neon
          python3 .stringzilla-driver/doc/stringzilla/merge-20261022/integrate.py controls --backend neon
      - name: Retain complete ARM candidate before tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-paired-candidate-neon-${{ github.sha }}
          path: candidate-retained
          retention-days: 30
          if-no-files-found: error
      - name: Validate native ARM contracts and sanitizers
        run: |
          python3 .stringzilla-driver/doc/stringzilla/merge-20261022/validate-neon.py
          python3 .stringzilla-driver/doc/stringzilla/merge-20261022/native-sanitizers.py --source . --jdk pair/fork --compiler /usr/bin/gcc-16 --output native-sanitizers
      - name: Validate native ARM dispatch, bounds and safepoints
        run: python3 .stringzilla-driver/doc/stringzilla/merge-20261022/jtreg.py
      - name: Repeated paired ARM measurements
        run: >-
          python3 .stringzilla-driver/doc/stringzilla/merge-20261022/compare.py
          --source . --controls pair/controls.json
          --manifest .stringzilla-driver/doc/stringzilla/merge-20261022/native-cases.json
          --output paired-results
      - name: Check out fixed independent source-indexing corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 416d7db3ec3cf03d0e4b05f919dce6aa9f9b5eda
          path: .stringzilla-corpus
          persist-credentials: false
          sparse-checkout: src/java.base/share/classes/java/lang
      - name: Ordinary ARM process comparisons
        run: >-
          python3 .stringzilla-driver/doc/stringzilla/merge-20261022/process-controls.py
          --source . --controls pair/process-controls.json --corpus .stringzilla-corpus --output process-results
      - name: Retain ARM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-paired-neon-${{ github.sha }}
          path: |
            paired-results
            process-results/*.json
            process-results/*.log
            process-results/*.stdout
            process-results/*.stderr
            process-results/*.txt
            process-results/*.java
            pair/*.json
            build/perf/configure.log
            pair/*.gmk
            pair/*.log
            pair/*.cmdline
            jtreg-evidence
            validation/*.json
            validation/*.log
            native-sanitizers/*.json
            native-sanitizers/*.log
            native-sanitizers/*.c
          if-no-files-found: error
          retention-days: 30
  msvc:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      MSYS2_PATH_TYPE: minimal
      CHERE_INVOKING: 1
      CONFIGURE_DEV_NO_MOLD: 1
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 15da3c455ba3f15993f581150c775bb7a941fccd
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .stringzilla-driver
          persist-credentials: false
          sparse-checkout: doc/stringzilla/merge-20261022
      - name: Restore verified independent Windows baseline
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/prepare.py','restore','--backend','msvc'],check=True)
      - uses: ./.github/actions/get-msys2
        with:
          architecture: x86.x64
      - uses: ./.github/actions/get-bootjdk
        id: bootjdk
        with:
          platform: windows-x64
      - name: Check MSVC 14.44 toolset
        id: msvc
        shell: bash
        run: |
          set +e
          '/c/Program Files/Microsoft Visual Studio/18/Enterprise/vc/auxiliary/build/vcvars64.bat' -vcvars_ver=14.44
          if [ $? -eq 0 ]; then echo 'installed=true' >> "$GITHUB_OUTPUT"; else echo 'installed=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install matching MSVC toolset if absent
        if: steps.msvc.outputs.installed != 'true'
        shell: bash
        run: >-
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe'
          modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          --add Microsoft.VisualStudio.Component.VC.14.44.x86.x64
      - name: Restore verified matched master image
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/restore-master.py','--backend','msvc'],check=True)
      - name: Build complete candidate with production kernel flags
        shell: env /usr/bin/bash --login -eo pipefail {0}
        env:
          PATH: ''
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
        run: |
          bash bin/configure-dev --with-conf-name=perf --with-debug-level=release \
            --with-boot-jdk="$BOOT_JDK" --with-version-opt=stringzilla-benchmark --with-version-pre=internal \
            --with-source-date=1792195200 --with-native-debug-symbols=none \
            --with-toolchain-version=2026 --with-msvc-toolset-version=14.44 --with-jmod-compress=zip-1
          make CONF=perf JOBS=2 images
      - name: Seal new candidate and verify actual compiler command
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/prepare.py','seal','--backend','msvc'],check=True)
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/integrate.py','controls','--backend','msvc'],check=True)
      - name: Retain complete Windows candidate before tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-paired-candidate-msvc-${{ github.sha }}
          path: |
            candidate-retained
            build/perf/images/jdk
            pair/master
          retention-days: 30
          if-no-files-found: error
      - name: Check native contracts, tiers, opt-out and forced JNI
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/validate-windows.py'],check=True)
      - name: Validate Windows dispatch, physical bounds and safepoints
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/jtreg.py'],check=True)
      - name: Repeated paired Windows measurements
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/compare.py',
            '--source','.','--controls','pair/controls.json',
            '--manifest','.stringzilla-driver/doc/stringzilla/merge-20261022/native-cases.json','--output','paired-results'],check=True)
      - name: Check out fixed independent source-indexing corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 416d7db3ec3cf03d0e4b05f919dce6aa9f9b5eda
          path: .stringzilla-corpus
          persist-credentials: false
          sparse-checkout: src/java.base/share/classes/java/lang
      - name: Ordinary Windows process comparisons
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/merge-20261022/process-controls.py',
            '--source','.','--controls','pair/process-controls.json','--corpus','.stringzilla-corpus','--output','process-results'],check=True)
      - name: Retain Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-paired-msvc-${{ github.sha }}
          path: |
            paired-results
            process-results/*.json
            process-results/*.log
            process-results/*.stdout
            process-results/*.stderr
            process-results/*.txt
            process-results/*.java
            pair/*.json
            pair/*.gmk
            pair/*.log
            pair/*.cmdline
            build/perf/configure.log
            validation
            jtreg-evidence
          if-no-files-found: error
          retention-days: 30
