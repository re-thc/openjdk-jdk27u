name: StringZilla remaining-loss paired checks
# Distinct follow-on: 16 previously uncovered loss/boundary controls per platform.
# Reuse digest-bound complete images from the primary run; no rebuild or test repeat.
on:
  push:
    branches: [codex/stringzilla-final-artifacts]
    paths: [.github/workflows/stringzilla-paired-final.yml]
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: stringzilla-remaining-loss-b19af25c
  cancel-in-progress: false
jobs:
  neon:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b19af25c4ccac240e017ca15bfbfc955d4798aa4
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .stringzilla-driver
          persist-credentials: false
          sparse-checkout: doc/stringzilla/integration-20261021
      - name: Install matching C++ runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6 libgcc-s1
      - name: Restore verified original, prior and exact-head complete images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .stringzilla-driver/doc/stringzilla/integration-20261021/reuse.py --backend neon
      - name: Record native runtime identity
        run: |
          ldd --version
          dpkg-query -W libstdc++6 libgcc-s1 libc6
      - name: Measure remaining loss and boundary controls
        run: >-
          python3 .stringzilla-driver/doc/stringzilla/integration-20261021/compare.py
          --source . --controls pair/controls.json
          --manifest .stringzilla-driver/doc/stringzilla/integration-20261021/native-followup-cases.json
          --output paired-results
      - name: Retain complete follow-on evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-remaining-loss-neon-${{ github.sha }}
          path: |
            paired-results
            pair/*.json
            pair/*.gmk
          retention-days: 30
          if-no-files-found: error
  msvc:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b19af25c4ccac240e017ca15bfbfc955d4798aa4
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .stringzilla-driver
          persist-credentials: false
          sparse-checkout: doc/stringzilla/integration-20261021
      - name: Restore verified original, prior and exact-head complete images
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/integration-20261021/reuse.py','--backend','msvc'],check=True)
      - name: Measure remaining loss and boundary controls
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','.stringzilla-driver/doc/stringzilla/integration-20261021/compare.py',
            '--source','.','--controls','pair/controls.json',
            '--manifest','.stringzilla-driver/doc/stringzilla/integration-20261021/native-followup-cases.json',
            '--output','paired-results'],check=True)
      - name: Retain complete follow-on evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-remaining-loss-msvc-${{ github.sha }}
          path: |
            paired-results
            pair/*.json
            pair/*.gmk
          retention-days: 30
          if-no-files-found: error
