name: ZIP controlled direct-call performance
on:
  push:
    branches: [pr/zlib-ng-x64-validation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zip-direct-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scalar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x64
            revision: f61aabacb002c19b57cfc802b709c5f033f880d3
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 90
    steps:
      - name: Install runtime and action tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 curl ca-certificates zstd libstdc++6 zlib1g
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: build/zip/images/jdk
          key: zip-image-v1-linux-${{ matrix.platform }}-${{ matrix.revision }}-gcc14-system-release
          fail-on-cache-miss: true
      - name: Record host and verify staged source
        run: |
          mkdir -p validation/results
          lscpu > validation/results/cpu.txt
          python3 -m py_compile .github/scripts/validate-direct-controls.py
      - name: Compare C2 with controlled sharing, order and buffer allocation
        run: python3 .github/scripts/validate-direct-controls.py build/zip/images/jdk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zip-direct-gate-${{ matrix.platform }}
          path: validation/results
          retention-days: 14
