name: Inspect final checksum test failures
on:
  push:
    branches: [pr/zlib-ng-validation]
    paths: ['.github/workflows/checksum-summary.yml']
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38277948503
          pattern: final-checksum-*
          path: results
      - name: Print failed jtreg records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('results').rglob('*.jtr')):
              text=path.read_text(errors='replace')
              if 'test result: Failed.' in text:
                  print('FAILED_RECORD',path,flush=True)
                  print(text[-20000:],flush=True)
          PY
