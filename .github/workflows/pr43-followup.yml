name: PR43 retained-image full parser and SVE checks
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  full-parser:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: doc/qualification/pr43-macos/cloud-parser-probe
      - name: Bind retained matched images and unchanged product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/followup_bind.py full admission
      - name: Restore exact retained release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12347874804'
          run-id: '39602216233'
          github-token: ${{ github.token }}
          path: retained-images
          merge-multiple: true
      - name: Check runtime reader
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/test_runtime_reader.py
      - name: Two diagnostics and twelve balanced full-parser pairs
        timeout-minutes: 30
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/full_compare.py --root . --out full-parser-evidence
      - name: Preserve every observation and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr43-full-parser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admission
            full-parser-evidence
          retention-days: 5
          if-no-files-found: warn
  sve-correctness:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: doc/qualification/pr43-macos/cloud-parser-probe
      - name: Bind retained fastdebug image and unchanged product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/followup_bind.py sve admission
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2b7b6060bea2b7ea057bbb52ddb81f63937e9cb1
          path: product
          persist-credentials: false
          sparse-checkout: |
            test/hotspot/jtreg
            test/lib
            test/jtreg-ext
      - name: Restore retained fastdebug image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12194059473'
          run-id: '39266688701'
          github-token: ${{ github.token }}
          path: fastdebug-download
          merge-multiple: true
      - name: Restore existing JTReg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12192388544'
          run-id: '39266688701'
          github-token: ${{ github.token }}
          path: jtreg
          merge-multiple: true
      - name: Check SVE evidence reader
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/test_sve_reader.py
      - name: Require effective SVE and executed exclusion assertions
        timeout-minutes: 10
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/sve_check.py --root . --out sve-evidence
      - name: Preserve correctness and IR records including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr43-sve-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admission
            sve-evidence
          retention-days: 5
          if-no-files-found: warn
