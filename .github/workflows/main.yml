name: PR74 focused Windows endpoint consumer

# Validation branch only. main.yml is already registered for workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr74-focused-windows-release
  cancel-in-progress: false

jobs:
  endpoints:
    if: github.ref == 'refs/heads/validate-pr74-windows-endpoints' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Checkout exact ordinary build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1694c2019ba5ad033983859c063c1c671d90cb01
          path: test-source
          persist-credentials: false
      - name: Verify retained release image and execute six actions once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python controller/.github/scripts/validate-socket-endpoint-windows.py
          --source test-source
          --work "$env:RUNNER_TEMP/pr74-consumer-${{ github.run_id }}"
          --output consumer-output
      - name: Upload selected test logs and bounded summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-windows-x64-pr74-focused
          retention-days: 5
          if-no-files-found: error
          path: |
            consumer-output/summary.json
            consumer-output/LocalSocketAddress.log
            consumer-output/LocalSocketPort.log
