name: PR51 Windows x64 decoder probes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr51-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/build-jtreg

  build:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline-release
            source: 01903ba375f94c0ab7f9193d3e36bd30fe663d7e
            debug: release
          - name: candidate-release
            source: b7898b9d0010e1436b873b95c59f5261092fb3f1
            debug: release
          - name: candidate-fastdebug
            source: b7898b9d0010e1436b873b95c59f5261092fb3f1
            debug: fastdebug
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          path: source
      - uses: ./.github/actions/get-msys2
        with:
          architecture: x86.x64
      - uses: ./.github/actions/get-bootjdk
        id: bootjdk
        with:
          platform: windows-x64
      - uses: ./.github/actions/get-jtreg
        id: jtreg
      - uses: ./.github/actions/get-gtest
        id: gtest
      - name: Configure exact clean source
        shell: env /usr/bin/bash --login -eo pipefail {0}
        env:
          PATH: ''
        run: |
          cd source
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          test -z "$(git status --porcelain)"
          bash bin/configure-dev \
            --with-conf-name=windows-x64 \
            --with-debug-level=${{ matrix.debug }} \
            --with-version-opt=pr51-windows-${{ matrix.source }} \
            --with-boot-jdk=${{ steps.bootjdk.outputs.path }} \
            --with-jtreg=${{ steps.jtreg.outputs.path }} \
            --with-gtest=${{ steps.gtest.outputs.path }} \
            --with-toolchain-version=2026 \
            --with-msvc-toolset-version=14.44 \
            --with-jmod-compress=zip-1 \
            --with-external-symbols-in-bundles=none
      - name: Build matched development-profile images
        run: make -C source CONF=windows-x64 JOBS=4 LOG=info images test-image
      - name: Package image and exact identities
        shell: pwsh
        run: |
          $out = 'build-output/${{ matrix.name }}'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse source/build/windows-x64/images/jdk "$out/jdk"
          Copy-Item -Recurse source/build/windows-x64/images/test/hotspot/jtreg/native "$out/native"
          Copy-Item source/build/windows-x64/spec.gmk "$out/spec.gmk"
          Copy-Item source/build/windows-x64/configure.log "$out/configure.log"
          Copy-Item source/build/windows-x64/build.log "$out/build.log"
          $spec = Get-Content -Raw "$out/spec.gmk"
          $compiler = [regex]::Match($spec, '(?m)^CXX_VERSION_NUMBER\s*:?=\s*(.+)$').Groups[1].Value.Trim()
          if ($compiler -notmatch '^19\.44\.') { throw "Unexpected MSVC: $compiler" }
          $meta = @{
            source = (& git -C source rev-parse HEAD).Trim()
            dirty = ((& git -C source status --porcelain) -join "`n")
            debug = '${{ matrix.debug }}'
            compiler = $compiler
            toolset = '14.44'
            configuration = 'bin/configure-dev; Windows x64; AVX2; toolchain 2026; toolset 14.44'
            jvm_sha256 = (Get-FileHash "$out/jdk/bin/server/jvm.dll" -Algorithm SHA256).Hash.ToLower()
            java_sha256 = (Get-FileHash "$out/jdk/bin/java.exe" -Algorithm SHA256).Hash.ToLower()
            runner_image = $env:ImageVersion
            run_id = $env:GITHUB_RUN_ID
            workflow_sha = $env:GITHUB_SHA
          }
          $meta | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$out/metadata.json"
          & "$out/jdk/bin/java.exe" -version 2>&1 | Set-Content "$out/java-version.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Built VM startup failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr51-windows-${{ matrix.name }}
          path: build-output/${{ matrix.name }}
          retention-days: 14
          compression-level: 1

  probe:
    needs: [prepare, build]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: re-thc/jzstd
          ref: 7a6b345d0df3d8571a30f4a9c974dfaa3a10d9b6
          path: codec
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b7898b9d0010e1436b873b95c59f5261092fb3f1
          path: candidate-source
      - uses: ./.github/actions/get-jtreg
        id: jtreg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: pr51-windows-*
          path: images
      - name: Record processor and runner
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json | Set-Content -Encoding utf8 windows-processor.json
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,TotalVisibleMemorySize | ConvertTo-Json | Set-Content -Encoding utf8 windows-os.json
      - name: Correctness, activation and fixed interleaved comparisons
        shell: pwsh
        run: |
          python -B -S .github/pr51-windows/probe.py --jtreg '${{ steps.jtreg.outputs.path }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr51-windows-probe-evidence
          path: |
            windows-evidence
            windows-processor.json
            windows-os.json
            .github/pr51-windows/plan.json
          retention-days: 30
