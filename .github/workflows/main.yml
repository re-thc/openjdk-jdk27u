name: FFM unbound code snapshot

on:
  push:
    branches: [codex/ffm-startup-diagnostic-20261014]

permissions:
  contents: read
  actions: read

jobs:
  inspect-unbound-linux-x64-release:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify native runner CPU before builds
        run: |
          mkdir "$RUNNER_TEMP/ffm-evidence"
          cp /proc/cpuinfo "$RUNNER_TEMP/ffm-evidence/runner-cpuinfo.txt"
          grep -m1 "model name" "$RUNNER_TEMP/ffm-evidence/runner-cpuinfo.txt"
          grep -q "AMD EPYC 9V74" "$RUNNER_TEMP/ffm-evidence/runner-cpuinfo.txt"
      - name: Install configured GCC16 toolchain
        run: |
          sudo apt update
          sudo apt install gcc-16 g++-16 ccache libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev libasound2-dev libcups2-dev libfontconfig1-dev libfreetype-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16
          test "$(gcc -dumpversion)" = 16
          test "$(g++ -dumpversion)" = 16
          gcc --version
      - name: Install configured mold 3.0.0
        run: |
          archive="$RUNNER_TEMP/mold.tar.gz"
          curl --fail --location --retry 3 https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz --output "$archive"
          echo "6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mold"
          tar --extract --file "$archive" --strip-components=1 --directory "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
      - name: Get configured BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Configure isolated pinned baseline
        env:
          BOOTJDK_PATH: ${{ steps.bootjdk.outputs.path }}
        run: |
          baseline=02324e6bd026411407983df06284cd79460c33f6
          target="$RUNNER_TEMP/ffm-target"
          output="$RUNNER_TEMP/ffm-evidence"
          git worktree add --detach "$target" "$baseline"
          test -d "$output"
          export SOURCE_DATE_EPOCH="$(git -C "$target" show -s --format=%ct "$baseline")"
          cd "$target"
          bash configure --with-conf-name=ffm-diagnostic --with-debug-level=release \
            --with-version-opt=ffm-diagnostic --with-boot-jdk="$BOOTJDK_PATH" \
            --with-freetype=system \
            --with-jmod-compress=zip-1 --with-native-debug-symbols=none --with-extra-ldflags=-fuse-ld=mold > "$output/configure.log" 2>&1
          cp build/ffm-diagnostic/spec.gmk "$output/spec.gmk"
      - name: Build matched baseline and A images
        id: build
        run: |
          python3 .github/ffm/diagnostic.py build-a --repo "$RUNNER_TEMP/ffm-target" --output "$RUNNER_TEMP/ffm-evidence"
      - name: Fixed unbound diagnostics with snapshots after timing
        run: |
          python3 .github/ffm/code_snapshot.py --output "$RUNNER_TEMP/ffm-evidence"
      - name: Summarize diagnostic status
        if: always()
        run: |
          result="$RUNNER_TEMP/ffm-evidence/unbound-snapshot/status.json"
          if test -f "$result"; then
            cat "$result" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Diagnostic stopped before completion; inspect preserved setup/fork evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve payload and every result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ffm-evidence/payload"
          cp -a .github/ffm/. "$RUNNER_TEMP/ffm-evidence/payload/"
          cp .github/workflows/main.yml "$RUNNER_TEMP/ffm-evidence/payload/"
          # Hash the images, but keep the portable evidence artifact bounded.
          tar --exclude=images --exclude=classes --exclude=native --exclude='jtreg-*-work/classes' \
            -czf "$RUNNER_TEMP/ffm-diagnostic-evidence.tar.gz" -C "$RUNNER_TEMP/ffm-evidence" .
      - name: Upload all evidence, including rejected data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffm-unbound-snapshot-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffm-diagnostic-evidence.tar.gz
          retention-days: 30
