name: Windows synchronous NIO validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-nio-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the ordinary repository JTReg artifact
        uses: ./.github/actions/build-jtreg

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      MSYS2_PATH_TYPE: minimal
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check the installed ordinary VS 2026 toolset without an installer
        shell: pwsh
        timeout-minutes: 2
        run: |
          $vcvars = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw 'The ordinary VS 2026 installation is missing; no installer fallback is allowed.'
          }
          $command = 'call "' + $vcvars + '" -vcvars_ver=14.44 >nul && where cl.exe'
          $compiler = & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'The installed 14.44 x64 toolset is unavailable.' }
          if (!(($compiler -join "`n") -match '\\18\\Enterprise\\VC\\Tools\\MSVC\\14\.44\.[^\\]+\\bin\\Hostx64\\x64\\cl\.exe')) {
            throw "Unexpected compiler selection: $compiler"
          }
          $compiler
      - name: Get ordinary MSYS2
        uses: ./.github/actions/get-msys2
        timeout-minutes: 10
        with:
          architecture: x86.x64
      - name: Get ordinary checksum-pinned BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        timeout-minutes: 5
        with:
          platform: windows-x64
      - name: Get ordinary JTReg artifact
        id: jtreg
        uses: ./.github/actions/get-jtreg
        timeout-minutes: 3
      - name: Get ordinary GTest source
        id: gtest
        uses: ./.github/actions/get-gtest
        timeout-minutes: 3
      - name: Build and test three exact native source states
        shell: pwsh
        timeout-minutes: 180
        env:
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
          JTREG_HOME: ${{ steps.jtreg.outputs.path }}
          GTEST_HOME: ${{ steps.gtest.outputs.path }}
        run: python .github/scripts/windows-nio-validate.py
      - name: Preserve bounded source and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 5
        with:
          name: windows-nio-${{ github.sha }}
          path: windows-nio-results/
          if-no-files-found: warn
          retention-days: 7
