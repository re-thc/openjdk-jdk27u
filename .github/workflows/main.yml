name: PR9 ARM fastdebug build identity only
on:
  workflow_dispatch:
    inputs:
      workflow-source-sha:
        description: 'Approved full commit SHA containing these workflow definitions'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr9-arm-fastdebug-identity-only
  cancel-in-progress: false
jobs:
  linux-aarch64:
    uses: ./.github/workflows/pr9-native-linux.yml
    with:
      workflow-source-sha: ${{ inputs.workflow-source-sha }}
