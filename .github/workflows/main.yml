name: PR3 macOS existing-image configuration checks
'on':
  push:
    branches: [diagnose-c1-policy-20261016]
    paths: [.github/workflows/main.yml, .github/scripts/pr3-macos-config.py]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr3-macos-config-${{ github.ref }}
  cancel-in-progress: false
jobs:
  configuration:
    if: ${{ github.event.before == 'cfac72faa3abdeed850cafb1aba70404e027faba' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Verify the qualification branch
        env:
          PUBLISH_PARENT: ${{ github.event.before }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/diagnose-c1-policy-20261016
          test "$PUBLISH_PARENT" = cfac72faa3abdeed850cafb1aba70404e027faba
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run four configuration checks on the retained image
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTPUT: ${{ runner.temp }}/pr3-macos-config
        run: python3 .github/scripts/pr3-macos-config.py "$PROBE_OUTPUT"
      - name: Preserve configuration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr3-macos-four-configurations
          path: ${{ runner.temp }}/pr3-macos-config/evidence
          if-no-files-found: error
          retention-days: 30
