name: 'C1 policy matched rebuild diagnostic'

# Staged replacement ONLY on a separate diagnostic branch. Keeping the existing
# main.yml path permits dispatch through its existing default-branch registration.

on:
  push:
    branches: [diagnose-c1-policy-20261016]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Separate diagnostic branch only. There are no PR triggers or automatic retries.
concurrency:
  group: c1-policy-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  LC_ALL: C
  LANG: C
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  build:
    if: github.ref == 'refs/heads/diagnose-c1-policy-20261016'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    outputs:
      archive-sha256: ${{ steps.build.outputs.archive_sha256 }}
      manifest-sha256: ${{ steps.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            make/scripts/c1-policy-diagnostic
            make/conf
      - name: 'Checkout immutable source history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fc06b7bf0599d23ef644bf5657ddab36e8d96a3d
          path: native-history
          fetch-depth: 16 # The two immutable source commits are ten commits apart.
          persist-credentials: false
      - name: 'Get checksum-pinned BootJDK using repository infrastructure'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: 'Prepare the repository Linux toolchain'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16 autoconf zip unzip python3-scipy
          curl --fail --location \
            https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/mold.tar.gz"
          echo "6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189  $RUNNER_TEMP/mold.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/mold"
          tar --extract --file "$RUNNER_TEMP/mold.tar.gz" --strip-components=1 --directory "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
      - name: 'Build original, matched control and patched HotSpot'
        id: build
        env:
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 make/scripts/c1-policy-diagnostic/build.py \
            --history "$GITHUB_WORKSPACE/native-history" \
            --boot-jdk "$BOOT_JDK" \
            --work "$RUNNER_TEMP/c1-build-work" \
            --output "$RUNNER_TEMP/c1-build-output"
      - name: 'Preserve build inputs, images and failures'
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c1-native-build-${{ github.run_id }}
          path: ${{ runner.temp }}/c1-build-output
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14

  diagnostic:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            make/scripts/c1-policy-diagnostic
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: c1-native-build-${{ github.run_id }}
          path: ${{ runner.temp }}/c1-native-artifact
      - name: 'Prepare analysis tools'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes python3-scipy binutils
      - name: 'Unpack the exact build artifact'
        env:
          ARCHIVE_SHA: ${{ needs.build.outputs.archive-sha256 }}
          MANIFEST_SHA: ${{ needs.build.outputs.manifest-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 make/scripts/c1-policy-diagnostic/preflight.py \
            --archive "$RUNNER_TEMP/c1-native-artifact/native-images.tar" \
            --archive-sha256 "$ARCHIVE_SHA" --manifest-sha256 "$MANIFEST_SHA" \
            --destination "$RUNNER_TEMP/c1-native-payload"
      - name: 'Run the frozen 196-fork / 50-minute protocol'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 make/scripts/c1-policy-diagnostic/run.py \
            --payload "$RUNNER_TEMP/c1-native-payload" \
            --output "$RUNNER_TEMP/c1-native-results"
      - name: 'Analyze without extending runtime or restarting measurements'
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/c1-native-results/completion.json" ]]; then
            /usr/bin/python3 make/scripts/c1-policy-diagnostic/analyze.py "$RUNNER_TEMP/c1-native-results"
          fi
      - name: 'Preserve every raw sample, command, diagnostic and HOLD'
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c1-native-results-${{ github.run_id }}
          path: ${{ runner.temp }}/c1-native-results
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
