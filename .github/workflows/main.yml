name: PR51 Windows repository-only qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr51-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-probe:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b7898b9d0010e1436b873b95c59f5261092fb3f1
          path: candidate-source
      - uses: ./.github/actions/get-jtreg
        id: jtreg
      - name: Record processor and runner
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json | Set-Content -Encoding utf8 windows-processor.json
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,TotalVisibleMemorySize | ConvertTo-Json | Set-Content -Encoding utf8 windows-os.json
      - name: Verify retained images, run repository gates and fixed standalone comparison
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JTREG_PATH: ${{ steps.jtreg.outputs.path }}
        run: |
          python -B -S .github/pr51-windows/standalone.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr51-windows-repository-evidence
          path: |
            windows-repository-evidence
            windows-processor.json
            windows-os.json
            .github/pr51-windows/standalone-plan.json
            .github/pr51-windows/standalone-approval.json
          retention-days: 30
