name: Native kqueue correctness

on:
  workflow_dispatch:
    inputs:
      expected_validation_sha:
        description: Exact full SHA of this dedicated validation branch
        required: true
        type: string
      jtreg_transfer_run_id:
        description: Completed staging run holding the pinned one-day jtreg artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: native-kqueue-correctness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-macos:
    if: github.ref == 'refs/heads/qualify/native-kqueue-correctness-once'
    runs-on: macos-26
    timeout-minutes: 85
    env:
      PYTHONUNBUFFERED: '1'
      EXPECTED_VALIDATION_SHA: ${{ inputs.expected_validation_sha }}
      JTREG_TRANSFER_RUN_ID: ${{ inputs.jtreg_transfer_run_id }}
    steps:
      - name: Initialize bounded evidence
        shell: bash
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import json, os, re, time
          from pathlib import Path
          start = time.monotonic()
          root = Path(os.environ['RUNNER_TEMP']) / 'native-kqueue-correctness-evidence'
          root.mkdir()
          data = {'monotonic': start, 'utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
          for key in ('GITHUB_SHA', 'GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_RUN_ID',
                      'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion'):
              data[key] = os.environ.get(key)
          (root / 'job-start.json').write_text(json.dumps(data, indent=2) + '\n')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get('EXPECTED_VALIDATION_SHA', '')):
              raise SystemExit('Exact lowercase validation SHA required')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ.get('JTREG_TRANSFER_RUN_ID', '')):
              raise SystemExit('Pinned harness staging run ID required')
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1':
              raise SystemExit('Reruns are outside this run contract')
          PY

      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Transfer exact clean jtreg distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 2
        with:
          name: native-kqueue-clean-jtreg-20261024
          path: ${{ runner.temp }}/native-kqueue-clean-jtreg
          github-token: ${{ github.token }}
          run-id: ${{ inputs.jtreg_transfer_run_id }}

      - name: Build candidate and check correctness once
        shell: bash
        timeout-minutes: 67
        run: |
          python3 -I .github/native-polling/correctness/controller.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/native-kqueue-correctness-evidence" \
            --transfer "$RUNNER_TEMP/native-kqueue-clean-jtreg" \
            --expected-sha "$EXPECTED_VALIDATION_SHA"

      - name: Always stop children and collect scoped evidence
        if: always()
        shell: bash
        timeout-minutes: 2
        env:
          PREVIOUS_JOB_STATUS: ${{ job.status }}
        run: |
          evidence="$RUNNER_TEMP/native-kqueue-correctness-evidence"
          artifacts="$RUNNER_TEMP/native-kqueue-correctness-artifacts"
          mkdir -p "$evidence" "$artifacts"
          cleanup_status=0
          controller=.github/native-polling/correctness/controller.py
          if test -f "$controller"; then
            python3 -I "$controller" --cleanup --output "$evidence" || cleanup_status=$?
          fi
          export NATIVE_CLEANUP_STATUS="$cleanup_status"
          python3 -I - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'native-kqueue-correctness-evidence'
          result = {'job_status_before_collection': os.environ.get('PREVIOUS_JOB_STATUS'),
                    'cleanup_status': int(os.environ['NATIVE_CLEANUP_STATUS']),
                    'utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
          if not (root / 'status.json').is_file():
              result['controller_status'] = 'not started or unable to record status'
          (root / 'collection.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          export_status=0
          if test -f "$controller"; then
            python3 -I "$controller" --output "$evidence" --export "$artifacts" || export_status=$?
          else
            for name in job-start.json collection.json status.json; do
              if test -f "$evidence/$name"; then cp "$evidence/$name" "$artifacts/$name"; fi
            done
          fi
          if test "$export_status" != 0; then
            cp "$evidence/collection.json" "$artifacts/export-failure.json"
          fi
          if test "$cleanup_status" != 0; then exit "$cleanup_status"; fi
          exit "$export_status"

      - name: Retain selected results for five days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 8
        with:
          name: native-kqueue-correctness-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-kqueue-correctness-artifacts
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
