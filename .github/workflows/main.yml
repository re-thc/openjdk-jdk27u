name: 'OpenJDK GHA Sanity Checks'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Targets: linux-x64, linux-aarch64, macos-aarch64, windows-x64'
        required: true
        default: 'linux-x64, linux-aarch64, macos-aarch64, windows-x64'
      configure-arguments:
        description: 'Additional configure arguments'
        required: false
      make-arguments:
        description: 'Additional make arguments'
        required: false
      dry-run:
        description: 'Skip builds and tests; only prepare dependencies and configure'
        type: boolean
        default: false
      pr43_full_parser_sve:
        description: 'Only PR43 retained-image full-parser timings and SVE correctness; no JDK builds'
        type: boolean
        default: false
      pr43_native_comparison:
        description: 'Only PR43 matched A/B release builds and 12 native timing pairs'
        type: boolean
        default: false
      pr43_native_parser_probe:
        description: 'Only PR43 pinned native ARM parser/codegen capture; no builds or timing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # PR updates share refs/pull/<number>/merge; branch runs share refs/heads/<branch>.
  # Keep this key independent of the commit so new runs cancel stale builds/tests.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr43-followup:
    if: github.event_name == 'workflow_dispatch' && inputs.pr43_full_parser_sve
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/pr43-followup.yml

  pr43-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.pr43_native_comparison && !inputs.pr43_full_parser_sve
    uses: ./.github/workflows/pr43-compare.yml

  pr43-native-parser:
    name: 'PR43 native ARM parser codegen'
    if: github.event_name == 'workflow_dispatch' && inputs.pr43_native_parser_probe && !inputs.pr43_native_comparison && !inputs.pr43_full_parser_sve
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: 'Checkout exact diagnostic source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: doc/qualification/pr43-macos/cloud-parser-probe

      - name: 'Bind current product, successful CI and pinned image'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/native_ci.py bind --out native-evidence

      - name: 'Reuse current native fastdebug image'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '12194059473'
          run-id: '39266688701'
          github-token: ${{ github.token }}
          path: image-download
          merge-multiple: true

      - name: 'Capture parser semantics, allocation and installed ARM bytes'
        run: python3 doc/qualification/pr43-macos/cloud-parser-probe/native_ci.py capture --out native-evidence --download image-download

      - name: 'Retain fresh records, including partial failures'
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr43-native-parser-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence
          retention-days: 5
          if-no-files-found: error

  prepare:
    name: 'Prepare the run'
    if: github.event_name != 'workflow_dispatch' || (!inputs.pr43_native_parser_probe && !inputs.pr43_native_comparison && !inputs.pr43_full_parser_sve)
    runs-on: ubuntu-26.04
    outputs:
      linux-x64: ${{ steps.include.outputs.linux-x64 }}
      linux-aarch64: ${{ steps.include.outputs.linux-aarch64 }}
      macos-aarch64: ${{ steps.include.outputs.macos-aarch64 }}
      windows-x64: ${{ steps.include.outputs.windows-x64 }}
      dry-run: ${{ steps.include.outputs.dry-run }}
    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Check what jobs to run'
        id: include
        env:
          REQUESTED_PLATFORMS: ${{ github.event.inputs.platforms || secrets.JDK_SUBMIT_PLATFORMS }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
        run: bash .github/scripts/select-platforms.sh

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg
        if: steps.include.outputs.linux-x64 == 'true' || steps.include.outputs.linux-aarch64 == 'true' || steps.include.outputs.macos-aarch64 == 'true' || steps.include.outputs.windows-x64 == 'true'

  build-linux-x64:
    name: linux-x64
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-x64
      gcc-major-version: '16'
      configure-arguments: ${{ github.event.inputs.configure-arguments }}
      make-arguments: ${{ github.event.inputs.make-arguments }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
    if: needs.prepare.outputs.linux-x64 == 'true'

  build-linux-aarch64:
    name: linux-aarch64
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-aarch64
      runs-on: 'ubuntu-26.04-arm'
      bootjdk-platform: linux-aarch64
      gcc-major-version: '16'
      configure-arguments: ${{ github.event.inputs.configure-arguments }}
      make-arguments: ${{ github.event.inputs.make-arguments }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
    if: needs.prepare.outputs.linux-aarch64 == 'true'

  build-macos-aarch64:
    name: macos-aarch64
    needs:
      - prepare
      - test-linux-x64
      - test-linux-aarch64
    uses: ./.github/workflows/build-macos.yml
    with:
      platform: macos-aarch64
      runs-on: 'macos-26'
      xcode-toolset-version: '26.6'
      configure-arguments: ${{ github.event.inputs.configure-arguments }}
      make-arguments: ${{ github.event.inputs.make-arguments }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
    # Selected Linux targets must finish successfully; manual non-Linux runs still work.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.macos-aarch64 == 'true' &&
      (needs.prepare.outputs.linux-x64 != 'true' || needs.test-linux-x64.result == 'success') &&
      (needs.prepare.outputs.linux-aarch64 != 'true' || needs.test-linux-aarch64.result == 'success')

  build-windows-x64:
    name: windows-x64
    needs:
      - prepare
      - test-linux-x64
      - test-linux-aarch64
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-x64
      runs-on: windows-2025
      architecture: 'x86.x64'
      msvc-toolset-version: '14.44'
      configure-arguments: ${{ github.event.inputs.configure-arguments }}
      make-arguments: ${{ github.event.inputs.make-arguments }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.windows-x64 == 'true' &&
      (needs.prepare.outputs.linux-x64 != 'true' || needs.test-linux-x64.result == 'success') &&
      (needs.prepare.outputs.linux-aarch64 != 'true' || needs.test-linux-aarch64.result == 'success')

  test-linux-x64:
    name: linux-x64
    needs:
      - prepare
      - build-linux-x64
    uses: ./.github/workflows/test.yml
    with:
      platform: linux-x64
      bootjdk-platform: linux-x64
      runs-on: ubuntu-26.04
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
      debug-suffix: -debug

  test-linux-aarch64:
    name: linux-aarch64
    needs:
      - prepare
      - build-linux-aarch64
    uses: ./.github/workflows/test.yml
    with:
      platform: linux-aarch64
      bootjdk-platform: linux-aarch64
      runs-on: ubuntu-26.04-arm
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
      debug-suffix: -debug

  test-macos-aarch64:
    name: macos-aarch64
    needs:
      - prepare
      - build-macos-aarch64
    uses: ./.github/workflows/test.yml
    with:
      platform: macos-aarch64
      bootjdk-platform: macos-aarch64
      runs-on: macos-26
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
      xcode-toolset-version: '26.6'
      debug-suffix: -debug

  test-windows-x64:
    name: windows-x64
    needs:
      - prepare
      - build-windows-x64
    uses: ./.github/workflows/test.yml
    with:
      platform: windows-x64
      bootjdk-platform: windows-x64
      architecture: 'x86.x64'
      runs-on: windows-2025
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
      debug-suffix: -debug
