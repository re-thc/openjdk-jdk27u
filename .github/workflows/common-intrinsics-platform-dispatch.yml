name: Common intrinsic Windows and macOS qualification dispatch
on:
  push:
    branches:
      - pr/common-intrinsics-platform-dispatch
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'main.yml',
              ref: 'common-intrinsics',
              inputs: { platforms: 'windows-x64,macos-aarch64' }
            });
            core.info('Requested native Windows x64 and macOS ARM builds and tier1 for common-intrinsics');
