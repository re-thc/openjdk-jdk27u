name: ZIP AOT flag validation
on:
  push:
    branches: [pr/zlib-ng-aot-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: zip-aot-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: bundles-jtreg-8.2.1+1
          run-id: 37263807373
          github-token: ${{ github.token }}
          path: jtreg/installed
      - uses: actions/download-artifact@v6
        with:
          name: bundles-linux-aarch64-debug
          run-id: 37269795926
          github-token: ${{ github.token }}
          path: bundles
      - name: Prepare verified assertion-enabled image
        run: |
          mkdir -p validation/image validation/results
          tar -xf bundles/jdk-linux-aarch64-debug.tar.gz -C validation/image
          python3 - <<'PY'
          import os
          from pathlib import Path
          images = [p.parent.parent.resolve() for p in Path("validation/image").glob("**/bin/java")]
          assert len(images) == 1, images
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("VALIDATION_JDK=" + str(images[0]) + "\n")
          PY
          git fetch --depth=1 origin f61aabacb002c19b57cfc802b709c5f033f880d3
          git fetch --depth=1 origin c3198fede2ba39de217bd46eb197d68790c85c71
          git diff c3198fede2ba39de217bd46eb197d68790c85c71 -- src make test > validation/results/implementation-diff.txt
          test ! -s validation/results/implementation-diff.txt
          git diff f61aabacb002c19b57cfc802b709c5f033f880d3 c3198fede2ba39de217bd46eb197d68790c85c71 -- src make > validation/results/image-source-diff.txt
          test ! -s validation/results/image-source-diff.txt
          echo c3198fede2ba39de217bd46eb197d68790c85c71 > validation/results/candidate-commit.txt
          python3 -m py_compile .github/scripts/validate-zip-backend.py
      - name: Verify collectors and AOT flag compatibility
        env:
          JTREG_PATH: ${{ github.workspace }}/jtreg/installed
        run: python3 .github/scripts/validate-zip-backend.py gc --jdk "$VALIDATION_JDK" --verify-oops
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zip-aot-aarch64
          path: |
            validation/results
            **/hs_err_pid*.log
          retention-days: 14
