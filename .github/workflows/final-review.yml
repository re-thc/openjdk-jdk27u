name: Final source compression and checksum qualification
on:
  push:
    branches: [pr/zlib-ng-validation]
    paths: ['.github/workflows/final-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4c610a0b60f5ac2016ac8073aa79d9c8ef1dbd9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          sparse-checkout: .github/scripts/qualify-final-review.py
          sparse-checkout-cone-mode: false
      - name: Wait for the final standard CI images
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          platform=os.environ['PLATFORM']
          required={'bundles-'+platform,'bundles-'+platform+'-debug','bundles-jtreg-8.2.1+1'}
          for attempt in range(480):
              result=subprocess.check_output(['gh','api','repos/re-thc/openjdk-jdk27u/actions/runs/38385493515/artifacts?per_page=100'],text=True)
              names={a['name'] for a in json.loads(result)['artifacts']}
              if required<=names:break
              print('Waiting for final source images',sorted(required-names),flush=True)
              time.sleep(15)
          else:raise RuntimeError('Final standard CI image artifacts were not ready')
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38385493515
          name: bundles-${{ matrix.platform }}
          path: validation/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38385493515
          name: bundles-${{ matrix.platform }}-debug
          path: validation/debug
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38305964372
          name: bundles-${{ matrix.platform }}
          path: validation/old
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38385493515
          name: bundles-jtreg-8.2.1+1
          path: jtreg/installed
      - name: Verify final release and debug images
        run: |
          mkdir -p validation/results
          lscpu > validation/results/cpu.txt
          git rev-parse HEAD > validation/results/source.txt
          python3 diagnostic/.github/scripts/qualify-final-review.py unpack
          python3 diagnostic/.github/scripts/qualify-final-review.py tests
      - name: Compare the C1 cutoff with the previous head and same-image JNI
        run: python3 diagnostic/.github/scripts/qualify-final-review.py bench
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-review-${{ matrix.platform }}
          path: validation/results
          retention-days: 14
