name: StringZilla four native ARM character crossover controls
on:
  push:
    branches: [codex/stringzilla-candidate-neon-char-crossover]
    paths: [.github/workflows/stringzilla-candidate-neon-char-crossover.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stringzilla-candidate-neon-char-crossover
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  measure:
    name: neon-c2 UTF char crossover
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    env:
      BACKEND: neon
      TIER: c2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e036e637a5aff1e2506ff82953a3fbd9fdba6a9d
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 416d7db3ec3cf03d0e4b05f919dce6aa9f9b5eda
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f7003b74572a93b774ffb9fe79fcc35a3efcdcb0
          path: pilot
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: auxiliary
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the actual backend before image downloads or timings
        id: physical
        shell: python
        run: |
          import os, py_compile, subprocess, sys
          path = "auxiliary/.github/scripts/stringzilla-candidate-neon-char-crossover.py"
          py_compile.compile(path, doraise=True)
          subprocess.run([sys.executable, path, "proof"], check=True)
          subprocess.run([sys.executable, path, "physical", "--backend", os.environ["BACKEND"],
                          "--tier", os.environ["TIER"]], check=True)
      - name: Restore only validated complete pilot images and attest runtime
        if: steps.physical.outputs.available == 'true'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "auxiliary/.github/scripts/stringzilla-candidate-neon-char-crossover.py",
              "prepare", "--backend", os.environ["BACKEND"], "--tier", os.environ["TIER"]], check=True)
      - name: Measure exactly four previously unmeasured original enabled and disabled triplets
        if: steps.physical.outputs.available == 'true'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "auxiliary/.github/scripts/stringzilla-candidate-neon-char-crossover.py",
              "measure", "--backend", os.environ["BACKEND"], "--tier", os.environ["TIER"]], check=True)
      - name: Retain every raw result or zero-timing unsupported receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringzilla-candidate-neon-char-crossover-${{ env.BACKEND }}-${{ env.TIER }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: perf-output
          if-no-files-found: error
          retention-days: 30

  collect:
    if: ${{ !cancelled() && needs.measure.result == 'success' }}
    needs: measure
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e036e637a5aff1e2506ff82953a3fbd9fdba6a9d
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/stringzilla-performance.py
            doc/stringzilla/native-cases.tsv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f7003b74572a93b774ffb9fe79fcc35a3efcdcb0
          path: pilot
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: auxiliary
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Reconstruct the exact four projections and validated image bindings
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "auxiliary/.github/scripts/stringzilla-candidate-neon-char-crossover.py",
                          "collection"], check=True)
      - name: Strictly qualify all controls samples and higher means
        shell: node {0}
        run: |
          const fs = require("fs"), crypto = require("crypto");
          const source = fs.readFileSync("pilot/.github/scripts/stringzilla-collector.js", "utf8");
          if (crypto.createHash("sha256").update(source).digest("hex") !==
              "058cbd0a291a2ba95f0d8e8bbe93a900a91d2a7709e4b0d0640278f208b28b26") throw Error("Wrong collector");
          const collect = Function("return (" + source + ")")();
          const input = JSON.parse(fs.readFileSync("perf-output/collection-input.json", "utf8"));
          const expected = new Set(input.expected_physical_keys), seen = new Set(), shards = [];
          if (expected.size !== 4 || input.entries.length !== 1) throw Error("Wrong supplement scope");
          const table = ["| Backend | Tier | Case | Original ns/op | Enabled ns/op | Disabled ns/op | O/E | D/E | Higher enabled mean |",
                         "| --- | --- | --- | ---: | ---: | ---: | ---: | ---: | --- |"];
          for (const entry of input.entries) {
            const result = collect(fs.readFileSync(entry.log_path, "utf8"), entry.backend, entry.job,
              entry.manifest, entry.source, entry.base, entry.expected);
            for (const group of result.groups) {
              const enabled = group.controls.enabled;
              const params = Object.fromEntries(Object.entries(enabled.params).sort(([a], [b]) => a.localeCompare(b)));
              const key = JSON.stringify([entry.backend, group.tier, enabled.benchmark, params]);
              if (!expected.has(key) || seen.has(key)) throw Error("Unexpected or duplicate input");
              seen.add(key);
              const higher = ["original", "disabled"].filter(control => group.comparisons[control].slower_mean)
                .map(control => control + (group.comparisons[control].intervals_overlap ? "" : "!"));
              const cells = ["original", "enabled", "disabled"].map(control =>
                group.controls[control].score.toFixed(3) + " +/- " + group.controls[control].error.toFixed(3));
              const ratios = ["original", "disabled"].map(control => group.comparisons[control].speedup.toFixed(3));
              table.push("| " + [entry.backend, group.tier, group.case, ...cells, ...ratios, higher.join(", ") || "-"].join(" | ") + " |");
            }
            shards.push(result);
          }
          if (seen.size !== expected.size || [...expected].some(key => !seen.has(key))) throw Error("Incomplete supplement");
          fs.writeFileSync("perf-output/qualification.json", JSON.stringify({
            source: "e036e637a5aff1e2506ff82953a3fbd9fdba6a9d", triplets: 4, records: 12, shards
          }, null, 2) + "\n");
          fs.writeFileSync("perf-output/QUALIFICATION.md",
            "These four matched complete-image triplets are disjoint from the 626 prior pilot and supplement inputs. Every higher enabled mean is retained; ! marks nonoverlapping reported intervals.\n\n" +
            table.join("\n") + "\n");
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stringzilla-candidate-neon-char-crossover-qualified-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: perf-output
          if-no-files-found: warn
          retention-days: 30
