name: PR18 fixed native int diagnostic

on:
  push:
    branches: [codex/pr18-native-int-diagnostic]
    paths: [.github/workflows/pr18-int-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: diagnostics/pr18-int
      - name: Select and record disk-backed runner scratch space
        shell: bash
        run: python3 diagnostics/pr18-int/filesystem.py select-scratch
      - name: Install fixed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_ROOT/boot" "$DIAGNOSTIC_ROOT/mold" "$DIAGNOSTIC_ROOT/jmh" "$DIAGNOSTIC_ROOT/benchmark" "$DIAGNOSTIC_ROOT/evidence"
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 autoconf make unzip libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev
          curl -fL --retry 2 https://download.java.net/java/GA/jdk27/55ce5470a6294008af0057ff4626d0e5/35/GPL/openjdk-27_linux-x64_bin.tar.gz -o "$DIAGNOSTIC_ROOT/boot.tar.gz"
          echo "95fc37eb3a18a27a26d5904c2d89d52bace8dafa9a078ca27f4747fbc4bf070b  $DIAGNOSTIC_ROOT/boot.tar.gz" | sha256sum -c
          tar -xf "$DIAGNOSTIC_ROOT/boot.tar.gz" --strip-components=1 -C "$DIAGNOSTIC_ROOT/boot"
          curl -fL --retry 2 https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz -o "$DIAGNOSTIC_ROOT/mold.tar.gz"
          echo "6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189  $DIAGNOSTIC_ROOT/mold.tar.gz" | sha256sum -c
          tar -xf "$DIAGNOSTIC_ROOT/mold.tar.gz" --strip-components=1 -C "$DIAGNOSTIC_ROOT/mold"
          python3 diagnostics/pr18-int/prepare.py
      - name: Build and freeze baseline
        shell: bash
        run: bash diagnostics/pr18-int/build.sh base 2>&1 | tee "$DIAGNOSTIC_ROOT/evidence/build-base.log"
      - name: One declared calibration and diagnostic experiment
        run: python3 diagnostics/pr18-int/run.py | tee "$DIAGNOSTIC_ROOT/evidence/experiment.log"
      - name: Retain all results, including calibration failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr18-native-int-diagnostic
          path: ${{ env.DIAGNOSTIC_ROOT }}/evidence
          retention-days: 90
      - name: Retain a console copy of diagnostic evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ['DIAGNOSTIC_ROOT'])
          archive = root / 'console-evidence.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted((root / 'evidence').rglob('*')):
                  if p.is_file():
                      z.write(p, str(p.relative_to(root / 'evidence')))
          print('PR18_EVIDENCE_SHA256=' + hashlib.sha256(archive.read_bytes()).hexdigest())
          print('PR18_EVIDENCE_BASE64_BEGIN')
          print(base64.encodebytes(archive.read_bytes()).decode().rstrip())
          print('PR18_EVIDENCE_BASE64_END')
          PY
