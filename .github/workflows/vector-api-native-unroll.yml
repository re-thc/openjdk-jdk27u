name: Vector API release unroll causal qualification
'on':
  push:
    branches: [codex/vector-api-native-unroll]
permissions:
  contents: read
  actions: read
jobs:
  release-causal:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reuse preserved matched images, frozen inputs and rejected pilot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38538129071
          artifact-ids: 11880558785
          path: prior
          merge-multiple: true
      - name: Verify unchanged images and compile controller-only primer
        run: |
          test "$(uname -m)" = aarch64
          mkdir base-release b3-release controller-classes
          tar -xf prior/baseline-bundles/jdk-linux-aarch64.tar.gz -C base-release --strip-components=1
          tar -xf prior/patched-bundles/jdk-linux-aarch64.tar.gz -C b3-release --strip-components=1
          ln -s prior/baseline-bundles baseline-bundles
          ln -s prior/patched-bundles patched-bundles
          python3 qualification/native_unroll/record_native_host.py
          python3 - <<'PY'
          import pathlib,hashlib,json
          plan=json.loads(pathlib.Path('prior/release-causal/plan.json').read_text())
          for image,directory in [('base87','base-release'),('b3','b3-release')]:
              for name,record in plan['images'][image].items():
                  p=pathlib.Path(directory)/name
                  assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==record['sha256']
          print('MATCHED_IMAGE_HASHES_VERIFIED=true')
          rejected=pathlib.Path('prior/release-causal/pair00-base87-eight-0-default-arithmetic.out')
          print('REJECTED_PILOT_OUTPUT_JSON='+json.dumps(rejected.read_text()))
          PY
          b3-release/bin/javac -cp prior/frozen/qualification/classes:prior/frozen/qualification/whitebox -d controller-classes qualification/src/ProbeControllerPrimer.java
      - name: Run primed fixed paired release workloads and separate assembly twins
        run: |
          python3 qualification/native_unroll/run_release_causal.py --base-jdk base-release --patched-jdk b3-release --frozen prior/frozen --primer-classes controller-classes --out release-causal --execute
      - name: Print structured final summaries and ordinary-entry assembly
        if: always()
        run: python3 qualification/native_unroll/report_release_causal.py
      - name: Preserve all windows, matched images, frozen inputs and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vector-api-release-unroll-causal-primed
          path: |
            release-causal
            native-ir-host.json
            controller-classes
            qualification/native_unroll
            qualification/src/ProbeControllerPrimer.java
            prior
          retention-days: 30
