name: Vector API JDK-8392077 initial native candidate gate
'on':
  push:
    branches:
    - codex/vector-api-native-unroll
permissions:
  contents: read
  actions: read
jobs:
  candidate-build:
    name: Build native candidate and matched b3 control (${{ matrix.level }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        level:
        - release
        - fastdebug
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout exact unpatched b3 production for matched release control
      if: matrix.level == 'release'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: b3ce67e362c3b1678fcf3d18ee714182b2395c86
        path: control-source
        persist-credentials: false
    - name: Reuse hash-verified b3 release modules and frozen evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38539204173
        artifact-ids: 11881672203
        path: saved
        merge-multiple: true
    - name: Get matched b3 fastdebug modules
      if: matrix.level == 'fastdebug'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38349570655
        artifact-ids: 11791725073
        path: debug-bundles
        merge-multiple: true
    - name: Install native build tools
      run: |
        sudo apt update
        sudo apt install gcc-16 g++-16 autoconf make zip unzip zlib1g-dev
        curl --fail --location --retry 3 https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-aarch64-linux.tar.gz --output "$RUNNER_TEMP/mold.tar.gz"
        echo "52c759d3689babaea4c42af2f31062a74ab83e17ffb5a8090232534c67b70577  $RUNNER_TEMP/mold.tar.gz" | sha256sum --check
        mkdir "$RUNNER_TEMP/mold"
        tar -xf "$RUNNER_TEMP/mold.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mold"
        echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
    - name: Build candidate and exact-b3 control with identical native tools and configure arguments
      env:
        BUILD_LEVEL: ${{ matrix.level }}
      run: |
        test "$(uname -m)" = aarch64
        mkdir b3-release template-jdk
        tar -xf saved/prior/patched-bundles/jdk-linux-aarch64.tar.gz -C b3-release --strip-components=1
        python3 - <<'PYHASH'
        import pathlib,hashlib,json
        plan=json.loads(pathlib.Path('saved/prior/release-causal/plan.json').read_text())
        for name,record in plan['images']['b3'].items():
            p=pathlib.Path('b3-release')/name
            assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==record['sha256']
        print('B3_RELEASE_HASHES_VERIFIED=true')
        PYHASH
        control_options=()
        if [[ "$BUILD_LEVEL" == fastdebug ]]; then
          tar -xf debug-bundles/jdk-linux-aarch64-debug.tar.gz -C template-jdk --strip-components=2
        else
          cp -a b3-release/. template-jdk/
          control_options+=(--control-source "$PWD/control-source")
        fi
        python3 qualification/native_unroll/build_backend_images.py --candidate-source "$PWD" "${control_options[@]}" --template-jdk template-jdk --boot-jdk b3-release --out backend-build --level "$BUILD_LEVEL" --execute
    - name: Show build failure
      if: failure()
      run: tail -100 backend-build/*/configure.log backend-build/*/build.log || true
    - name: Preserve image and complete build provenance
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: vector-api-8392077-candidate-${{ matrix.level }}
        path: |-
          backend-build/*.tar.gz
          backend-build/*.json
          backend-build/*.txt
          backend-build/candidate
          backend-build/rebuilt_b3
        retention-days: 30
  release-gate:
    name: Native release candidate ${{ matrix.mode }}
    needs:
    - candidate-build
    - focused-semantics
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode:
        - timing
        - assembly
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38539204173
        artifact-ids: 11881672203
        path: saved
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: vector-api-8392077-candidate-release
        path: built
    - name: Verify images and byte-identical fixed controller
      run: |
        test "$(uname -m)" = aarch64
        mkdir base-release b3-release controller-classes
        tar -xf saved/prior/baseline-bundles/jdk-linux-aarch64.tar.gz -C base-release --strip-components=1
        tar -xf saved/prior/patched-bundles/jdk-linux-aarch64.tar.gz -C b3-release --strip-components=1
        tar -xf built/rebuilt-b3-jdk.tar.gz
        tar -xf built/candidate-jdk.tar.gz
        python3 - <<'PY'
        import pathlib,hashlib,json
        plan=json.loads(pathlib.Path('saved/prior/release-causal/plan.json').read_text())
        for image,directory in [('base87','base-release'),('b3','b3-release')]:
            for name,record in plan['images'][image].items():
                p=pathlib.Path(directory)/name
                assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==record['sha256']
        for directory in ['candidate-jdk','rebuilt-b3-jdk']:
            for name in ['bin/java','lib/modules','release']:
                assert pathlib.Path(directory,name).read_bytes()==pathlib.Path('b3-release',name).read_bytes()
        matched=json.loads(pathlib.Path('built/matched-build-results.json').read_text())
        assert matched['candidate']['commands']['configure'][2:]==matched['rebuilt_b3']['commands']['configure'][2:]
        assert matched['candidate']['commands']['make']==matched['rebuilt_b3']['commands']['make']
        assert matched['candidate']['commands']['compiler_env']==matched['rebuilt_b3']['commands']['compiler_env']
        print('MATCHED_IMAGES_AND_UNCHANGED_JAVA_MODULES_VERIFIED=true')
        PY
        b3-release/bin/javac -cp saved/prior/frozen/qualification/classes:saved/prior/frozen/qualification/whitebox -d controller-classes qualification/src/FixedVectorProbe.java qualification/src/ProbeControllerPrimer.java
        python3 qualification/native_unroll/record_native_host.py
    - name: Run fixed paired timings or separate ordinary-entry assembly
      env:
        EXPERIMENT_MODE: ${{ matrix.mode }}
      run: python3 qualification/native_unroll/run_backend_candidate.py --base-jdk base-release --b3-jdk b3-release --rebuilt-b3-jdk
        rebuilt-b3-jdk --candidate-jdk candidate-jdk --frozen saved/prior/frozen --controller controller-classes --out candidate-${{
        matrix.mode }} --mode "$EXPERIMENT_MODE" --execute
    - name: Install pinned ARM decoder separately from timed processes
      if: always() && matrix.mode == 'assembly'
      run: |
        mkdir -p decoder-provenance
        cat > decoder-provenance/requirements.txt <<'PIPREQUIREMENTS'
        capstone==5.0.9 --hash=sha256:41772ad0c71aa5d3e97d541e802593c2e71fb94ac7e20d4202f97ce2a3eb8ed5
        PIPREQUIREMENTS
        python3 -m pip download --require-hashes --only-binary=:all: --no-deps -r decoder-provenance/requirements.txt --dest decoder-provenance/wheel
        python3 -m pip install --require-hashes --no-deps --no-index --find-links decoder-provenance/wheel --target "$RUNNER_TEMP/decoder" -r decoder-provenance/requirements.txt
        sha256sum decoder-provenance/wheel/*.whl > decoder-provenance/wheel.sha256
    - name: Export incomplete runs and decode ordinary entry for explicit review
      if: always()
      run: python3 qualification/native_unroll/report_backend_candidate.py candidate-${{ matrix.mode }}
      env:
        PYTHONPATH: ${{ runner.temp }}/decoder
    - name: Preserve every paired process and complete diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: vector-api-8392077-${{ matrix.mode }}
        path: |-
          candidate-${{ matrix.mode }}
          controller-classes
          native-ir-host.json
          qualification/native_unroll
          qualification/src/FixedVectorProbe.java
          qualification/src/ProbeControllerPrimer.java

          decoder-provenance
          built/matched-build-plan.json
          built/matched-build-results.json
          built/candidate
          built/rebuilt_b3
        retention-days: 30
  focused-semantics:
    name: Native candidate interpreter C1 C2 IR and stress
    needs: candidate-build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: vector-api-8392077-candidate-release
        path: release-built
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: vector-api-8392077-candidate-fastdebug
        path: debug-built
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38539204173
        artifact-ids: 11881672203
        path: saved
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 38349570655
        artifact-ids: 11790243299
        path: jtreg
        merge-multiple: true
    - name: Extract matched candidate images and execute focused qualification
      run: |
        test "$(uname -m)" = aarch64
        mkdir candidate-release candidate-debug base-release b3-release
        tar -xf release-built/rebuilt-b3-jdk.tar.gz
        tar -xf release-built/candidate-jdk.tar.gz -C candidate-release --strip-components=1
        tar -xf debug-built/candidate-jdk.tar.gz -C candidate-debug --strip-components=1
        tar -xf saved/prior/baseline-bundles/jdk-linux-aarch64.tar.gz -C base-release --strip-components=1
        tar -xf saved/prior/patched-bundles/jdk-linux-aarch64.tar.gz -C b3-release --strip-components=1
        python3 qualification/native_unroll/record_native_host.py
        python3 qualification/native_unroll/run_backend_semantics.py --release-jdk candidate-release --debug-jdk candidate-debug --base-jdk base-release --b3-jdk b3-release --rebuilt-b3-jdk rebuilt-b3-jdk --jtreg jtreg --frozen saved/prior/frozen --out focused-semantics --execute
    - name: Preserve actual execution levels, IR, stress and exceptional-value checks
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: vector-api-8392077-focused-semantics
        path: |
          focused-semantics
          native-ir-host.json
          qualification/native_unroll
          test/hotspot/jtreg/compiler/vectorapi/TestZeroSeedFPReduction*.java
        retention-days: 30
