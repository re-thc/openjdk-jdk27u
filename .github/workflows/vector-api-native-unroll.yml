name: Preserve Vector API causal evidence
'on':
  push:
    branches: [codex/vector-api-native-unroll]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38542568378
          artifact-ids: 11883417851
          path: evidence
          merge-multiple: true
      - name: Verify and export complete qualified process-level windows
        run: python3 qualification/native_unroll/export_qualified_evidence.py
      - name: Preserve compact evidence and validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vector-api-causal-process-evidence
          path: compact-evidence
          retention-days: 30
