name: Decoder replacement semantic preflight
on:
  push:
    branches: [review/simdutf-replacement-semantics]
permissions:
  contents: read
  actions: read
jobs:
  semantics:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bundles-windows-x64
          run-id: 38601904956
          github-token: ${{ github.token }}
          path: bundles
      - name: Check replacement semantics (patched-class diagnostic)
        run: python make/scripts/simdutf-replacement-semantics.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: replacement-semantic-preflight
          path: semantic-results/source
          retention-days: 7
