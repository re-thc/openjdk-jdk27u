name: ZIP reusable-stream alignment comparison
on:
  push:
    branches: [pr/zlib-ng-x64-validation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zip-pool-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/get-bootjdk
        id: boot
        with:
          platform: linux-x64
      - uses: actions/checkout@v6
        with:
          ref: 33e539f2d4a847f283a3793df6eebd41b9d1dfac
          path: validation/baseline
      - uses: actions/cache/restore@v4
        with:
          path: build/zip/images/jdk
          key: zip-image-v1-linux-x64-f61aabacb002c19b57cfc802b709c5f033f880d3-gcc14-system-release
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: validation/baseline/build/zip/images/jdk
          key: zip-baseline-image-v1-linux-x64-33e539f2d4a847f283a3793df6eebd41b9d1dfac-gcc14-system-release
          fail-on-cache-miss: true
      - name: Verify native source and record host
        run: |
          mkdir -p validation/results
          git fetch --depth=1 origin 37d4b14c9121ba49a558e131c471e04fe11ca4ce
          git diff 37d4b14c9121ba49a558e131c471e04fe11ca4ce -- src make test > validation/results/implementation-diff.txt
          test ! -s validation/results/implementation-diff.txt
          echo 37d4b14c9121ba49a558e131c471e04fe11ca4ce > validation/results/native-source.txt
          lscpu > validation/results/cpu.txt
          dpkg-query -W zlib1g > validation/results/zlib.txt
          python3 -m py_compile .github/scripts/validate-zip-backend.py
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 zlib1g-dev libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev libxtst-dev
      - name: Rebuild libzip using cached JDK dependencies
        env:
          CC: gcc-14
          CXX: g++-14
          BOOT_JDK: ${{ steps.boot.outputs.path }}
        run: |
          bash configure --with-conf-name=zip-profile --with-boot-jdk="$BOOT_JDK" --with-zlib=system --with-debug-level=release --with-native-debug-symbols=none --disable-warnings-as-errors
          mkdir -p build/zip-profile/support/headers/java.base build/zip-profile/support/modules_libs/java.base/server validation/header-classes
          cp build/zip/images/jdk/lib/libjava.so build/zip-profile/support/modules_libs/java.base/
          cp build/zip/images/jdk/lib/server/libjvm.so build/zip-profile/support/modules_libs/java.base/server/
          build/zip/images/jdk/bin/javac --patch-module java.base=src/java.base/share/classes -h build/zip-profile/support/headers/java.base -d validation/header-classes src/java.base/share/classes/java/util/zip/Adler32.java src/java.base/share/classes/java/util/zip/CRC32.java src/java.base/share/classes/java/util/zip/Deflater.java src/java.base/share/classes/java/util/zip/Inflater.java
          if make -j2 -I make/modules/java.base -f make/modules/java.base/Lib.gmk SPEC="$PWD/build/zip-profile/spec.gmk" MODULE=java.base "$PWD/build/zip-profile/support/modules_libs/java.base/libzip.so"; then
            cp build/zip-profile/support/modules_libs/java.base/libzip.so build/zip/images/jdk/lib/
            mkdir -p build/zip-profile/images
            ln -s "$PWD/build/zip/images/jdk" build/zip-profile/images/jdk
            echo native-library-only > validation/results/build-method.txt
          else
            make CONF=zip-profile JOBS=2 images
            echo full-image > validation/results/build-method.txt
          fi
      - name: Compare single and pooled contexts under all compilation tiers
        run: python3 .github/scripts/validate-zip-backend.py pool --jdk build/zip-profile/images/jdk --baseline validation/baseline/build/zip/images/jdk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zip-pool-comparison-x86
          path: validation/results
          retention-days: 14
