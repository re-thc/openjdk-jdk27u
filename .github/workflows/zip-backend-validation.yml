name: Stock zlib allocation alignment diagnosis
on:
  push:
    branches: [pr/zlib-ng-validation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zip-alignment-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install compiler and system zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 zlib1g-dev
      - name: Record host and benchmark controlled alignments
        run: |
          mkdir -p validation/results
          lscpu > validation/results/cpu.txt
          dpkg-query -W zlib1g > validation/results/zlib.txt
          gcc-14 -O2 -Wall -Wextra .github/scripts/profile-stock-zlib.c -lz -o validation/profile-stock-zlib
          python3 - <<'PY'
          import os, subprocess
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          p = subprocess.run(["validation/profile-stock-zlib"], capture_output=True, text=True, check=True)
          print(p.stdout, flush=True)
          open("validation/results/controlled-alignment.csv", "w").write(p.stdout)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: controlled-zlib-alignment-${{ matrix.runner }}
          path: validation/results
          retention-days: 14
