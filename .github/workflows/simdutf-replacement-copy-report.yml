name: Inspect SIMDUTF replacement copy inlining
on:
  push:
    branches: [review/simdutf-replacement-copy-report]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: simdutf-dispatch-api-linux-x64
          run-id: 38764733252
          github-token: ${{ github.token }}
          path: reports
      - shell: python
        run: |
          import pathlib,re,json
          root=pathlib.Path("reports")
          for mode in ("base","on"):
              raw=(root/(mode+"-malformedSequenceDecode-compiled.log")).read_text()
              lines=raw.splitlines()
              for i,l in enumerate(lines):
                  if "@"in l and not l.lstrip().startswith(";") and any(n in l for n in("StringUTF16::getChars0","StringUTF16::getChars (","String::getChars (","HeapCharBuffer::put (","CharBuffer::put (")):
                      print("COPY_CONTEXT",mode,json.dumps(lines[max(0,i-2):i+5]),flush=True)
          print("COPY_REPORT_COMPLETE",flush=True)
