name: StringZilla final SDK verification
on:
  push:
    branches: [codex/stringzilla-final-artifacts]
    paths: [.github/workflows/stringzilla-final-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stringzilla-raw-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 519b2bf77f161cae881fdd26db26ed5e4935bcc0
          persist-credentials: false
          sparse-checkout: doc/stringzilla
      - name: Locate existing final SDK artifacts without publishing a Git manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          images = []
          for run, producer, prefixes in [
              (39798393906, '41576002458dad870944cff79ae17cfb2a1f7044', {
                  'neon': 'stringzilla-paired-candidate-neon-',
                  'msvc': 'stringzilla-paired-candidate-msvc-'}),
              (39798410962, '8baad0509910c79eaf172afa4d3fbaef7f7b71c0', {
                  'linux': 'stringzilla-fresh-linux-images-'})]:
              url = f'https://api.github.com/repos/re-thc/openjdk-jdk27u/actions/runs/{run}/artifacts?per_page=100'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  artifacts = json.load(response)['artifacts']
              for label, prefix in prefixes.items():
                  matches = [a for a in artifacts if a['name'] == prefix + producer]
                  assert len(matches) == 1
                  a = matches[0]
                  assert not a['expired'] and a['workflow_run']['id'] == run
                  assert a['workflow_run']['head_sha'] == producer and a['digest'].startswith('sha256:')
                  image = {'label': label, 'artifact': a['id'], 'sha256': a['digest'][7:],
                           'run': run, 'producer': producer,
                           'source': '93a0e98a80ea4807a45cc59a5334483a44b8cec6'}
                  if label == 'linux':
                      image['prior'] = 'c17c5cb06297e25681b4dab2eddbd60ceffe0300'
                  images.append(image)
          Path('sdk-inputs.json').write_text(json.dumps({'images': images}, indent=2) + '\n')
          PY
      - name: Verify every payload file and all shipped String classes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 doc/stringzilla/merge-20261022/final-sdk-audit.py
          --manifest sdk-inputs.json --output retained-audit
      - name: Retain read-only verification in Actions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-final-sdk-verification-${{ github.sha }}
          path: |
            sdk-inputs.json
            retained-audit
          retention-days: 30
          if-no-files-found: error
