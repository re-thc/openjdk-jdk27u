name: StringZilla retained U raw-file verification
on:
  push:
    branches: [codex/stringzilla-final-artifacts]
    paths: [.github/workflows/stringzilla-final-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stringzilla-raw-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b14f7783c59409b06c52fd40ce7fcf8afe6075ca
          persist-credentials: false
          sparse-checkout: doc/stringzilla
      - name: Verify original U JMH files and every paired round
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 doc/stringzilla/merge-20261022/final-audit.py
          --manifest doc/stringzilla/dispatch-20261022/final-audit-artifacts.json
          --output retained-audit
      - name: Retain U raw verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stringzilla-u-raw-verification-${{ github.sha }}
          path: retained-audit
          retention-days: 30
          if-no-files-found: error
