name: Compression level mapping qualification
on:
  push:
    branches: [pr/zlib-ng-validation]
    paths: ['.github/workflows/level-mapping.yml']
permissions:
  contents: read
jobs:
  levels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c3d3c2fd622f92e47e7e1e859a6c767ffa2f4cb
          path: production
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9870d54525f8f5a1315da6f2f9b289fb535e26a3
          path: corpora
      - name: Build identical-compiler library controls and compare levels
        working-directory: production
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 make python3
          mkdir -p validation/levels
          lscpu | tee validation/levels/cpu.txt
          gcc-14 --version > validation/levels/compiler.txt
          python3 ../diagnostic/.github/scripts/level-mapping.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: level-mapping-${{ matrix.platform }}
          path: production/validation/levels
          retention-days: 30
