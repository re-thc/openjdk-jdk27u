name: ZIP paired small-stream controls
on:
  push:
    branches: [pr/zlib-ng-validation]
    paths:
      - '.github/workflows/zip-paired-controls.yml'
      - '.github/scripts/zip-paired-controls.py'
permissions:
  contents: read
concurrency:
  group: zip-paired-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/zip-review/images/jdk
          key: zip-review-image-v3-${{ matrix.platform }}-71b1ffe02554ad195387a415bb5b57d40a1593dd
          fail-on-cache-miss: true
      - run: |
          mkdir -p validation/results
          lscpu > validation/results/cpu.txt
          python3 .github/scripts/zip-paired-controls.py build/zip-review/images/jdk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zip-paired-controls-${{ matrix.platform }}
          path: validation/results
          retention-days: 30
