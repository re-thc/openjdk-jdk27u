name: ZIP checksum and native bridge qualification
on:
  push:
    branches: [pr/zlib-ng-validation]
    paths: ['.github/workflows/zip-review-fixes.yml']
permissions:
  contents: read
  actions: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/zip-review/images/jdk
          key: zip-review-image-v3-${{ matrix.platform }}-b793e5980be27c4dcf25055b2418c91d92289393
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 38176106419
          name: bundles-jtreg-8.2.1+1
          path: jtreg/installed
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf gawk make python3 zlib1g-dev libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev libxtst-dev
          mkdir -p validation/results
          lscpu > validation/results/cpu.txt
          git rev-parse HEAD > validation/results/source.txt
      - name: Build checksum candidate against the completed qualification image
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cp -a build/zip-review/images/jdk validation/old-jdk
          zip_boot_jdk="$PWD/validation/old-jdk"
          cp -a validation/old-jdk validation/new-jdk
          python3 .github/scripts/qualify-zip-adler.py prepare
          bash configure --with-conf-name=zip-adler --with-boot-jdk="$zip_boot_jdk" --with-debug-level=release --with-native-debug-symbols=none --with-zlib=system
          make CONF=zip-adler JOBS=4 hotspot java.base-libs
          cp build/zip-adler/support/modules_libs/java.base/server/libjvm.so validation/new-jdk/lib/server/
          cp build/zip-adler/support/modules_libs/java.base/libzip.so validation/new-jdk/lib/
          validation/new-jdk/bin/java -Xshare:off -version
      - name: Build assertion-enabled VM for AOT and GC checks
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          bash configure --with-conf-name=zip-adler-debug --with-boot-jdk="$PWD/validation/old-jdk" --with-debug-level=fastdebug --with-native-debug-symbols=none --with-zlib=system
          make CONF=zip-adler-debug JOBS=4 hotspot
          cp -a validation/new-jdk validation/debug-jdk
          cp build/zip-adler-debug/support/modules_libs/java.base/server/libjvm.so validation/debug-jdk/lib/server/
      - name: Verify checksum boundaries, GC and AOT restoration
        run: python3 .github/scripts/qualify-zip-adler.py tests
      - name: Compare checksum kernels on the same runner
        run: python3 .github/scripts/qualify-zip-adler.py bench
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checksum-followup-${{ matrix.platform }}
          path: validation/results
          retention-days: 14
