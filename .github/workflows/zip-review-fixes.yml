name: Checksum call-path qualification
on:
  push:
    branches: [pr/zlib-ng-validation]
    paths: ['.github/workflows/zip-review-fixes.yml']
permissions:
  contents: read
  actions: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38190562646
          name: bundles-${{ matrix.platform }}
          path: validation/bundles
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38190562646
          name: bundles-jtreg-8.2.1+1
          path: jtreg/installed
      - name: Prepare tools and the completed current-head image
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf gawk make python3 zlib1g-dev libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev libxtst-dev
          mkdir -p validation/results validation/unpacked
          tar -xf validation/bundles/jdk-${{ matrix.platform }}.tar.gz -C validation/unpacked
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          release=next(Path('validation/unpacked').rglob('release'))
          shutil.copytree(release.parent, 'validation/old-jdk')
          PY
          lscpu > validation/results/cpu.txt
          git rev-parse HEAD > validation/results/source.txt
      - name: Build checksum candidate without repeating the complete JDK build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          bash configure --with-conf-name=zip-checksums --with-boot-jdk="$PWD/validation/old-jdk" --with-debug-level=release --with-native-debug-symbols=none --with-zlib=system
          make CONF=zip-checksums JOBS=4 hotspot java.base-libs java.base-java
          python3 .github/scripts/qualify-checksum-paths.py image
          validation/new-jdk/bin/java -Xshare:off -version
      - name: Compare existing kernels, zlib-ng JNI and direct zlib-ng
        run: python3 .github/scripts/qualify-checksum-paths.py bench
      - name: Build assertion-enabled VM
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          bash configure --with-conf-name=zip-checksums-debug --with-boot-jdk="$PWD/validation/old-jdk" --with-debug-level=fastdebug --with-native-debug-symbols=none --with-zlib=system
          make CONF=zip-checksums-debug JOBS=4 hotspot
          cp -a validation/new-jdk validation/debug-jdk
          cp build/zip-checksums-debug/support/modules_libs/java.base/server/libjvm.so validation/debug-jdk/lib/server/
      - name: Verify boundaries, registers, GC and AOT restoration
        run: python3 .github/scripts/qualify-checksum-paths.py tests
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checksum-paths-${{ matrix.platform }}
          path: validation/results
          retention-days: 14
