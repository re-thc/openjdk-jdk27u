name: ZIP review fixes and corpus qualification
on:
  push:
    branches: [pr/zlib-ng-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: zip-review-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake python3 zlib1g-dev
          mkdir -p validation/results
          lscpu > validation/results/cpu.txt
          git rev-parse HEAD > validation/results/source.txt
          python3 -m py_compile .github/scripts/validate-review-fixes.py
      - name: Compare real corpora at levels 1, 3, 6 and 9
        run: python3 .github/scripts/validate-review-fixes.py native
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-corpora-${{ matrix.platform }}
          path: validation/results
          retention-days: 14
  full:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/get-bootjdk
        id: boot
        with:
          platform: ${{ matrix.platform }}
      - uses: actions/download-artifact@v8
        with:
          name: bundles-jtreg-8.2.1+1
          path: jtreg/installed
          run-id: 37342065111
          github-token: ${{ github.token }}
      - name: Install toolchain and create nondefault target sysroot
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 autoconf gawk make python3 zlib1g-dev libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev libxtst-dev
          mkdir -p validation/results validation/sysroot/usr
          cp -a /usr/include validation/sysroot/usr/
          ln -s /usr/lib validation/sysroot/usr/lib
          ln -s /lib validation/sysroot/lib
          ln -s /lib64 validation/sysroot/lib64
          echo "#define ZIP_SYSROOT_PROBE 1" > validation/sysroot/usr/include/zip_sysroot_probe.h
          lscpu > validation/results/cpu.txt
          git rev-parse HEAD > validation/results/source.txt
          python3 -m py_compile .github/scripts/validate-review-fixes.py
      - name: Configure and build full image with required sysroot-only header
        env:
          CC: gcc-14
          CXX: g++-14
          BOOT_JDK: ${{ steps.boot.outputs.path }}
        run: |
          bash configure --with-conf-name=zip-review --with-boot-jdk="$BOOT_JDK" --with-zlib=system --with-debug-level=release --with-native-debug-symbols=none --with-jmod-compress=zip-1 --with-sysroot="$PWD/validation/sysroot" --with-extra-cflags="-include zip_sysroot_probe.h"
          make CONF=zip-review JOBS=4 images
          cp build/zip-review/spec.gmk validation/results/spec.gmk
          cp build/zip-review/support/native/zlib-ng/Makefile validation/results/ng-Makefile
          build/zip-review/images/jdk/bin/java -XX:+PrintFlagsFinal -version > validation/results/default-flags.txt 2>&1
      - uses: actions/cache/save@v4
        with:
          path: build/zip-review/images/jdk
          key: zip-review-image-v1-${{ matrix.platform }}-${{ github.sha }}
      - name: Run ZIP jtreg, GC and JNI checks
        run: python3 .github/scripts/validate-zip-backend.py tests --jdk build/zip-review/images/jdk --jtreg jtreg/installed
      - name: Qualify independent defaults in interpreter, C1 and C2
        run: python3 .github/scripts/validate-review-fixes.py defaults build/zip-review/images/jdk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: review-fixes-${{ matrix.platform }}
          path: validation/results
          retention-days: 14
