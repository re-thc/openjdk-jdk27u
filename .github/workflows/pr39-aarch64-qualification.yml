name: PR39 native AArch64 qualification
run-name: PR39 one bounded native AArch64 campaign

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact commit independently reviewed and approved for this one campaign'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr39-native-aarch64-qualification
  cancel-in-progress: false

jobs:
  jtreg:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: >-
      github.run_attempt == 1 && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/pr39-aarch64-qualification' &&
      github.event.inputs.reviewed_commit == github.sha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-jtreg

  qualification:
    needs: jtreg
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 210
    if: >-
      github.run_attempt == 1 && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/pr39-aarch64-qualification' &&
      github.event.inputs.reviewed_commit == github.sha
    steps:
      - name: Define qualification directories
        shell: bash
        run: |
          printf 'QUAL_ROOT=%s/pr39-work\nQUAL_EVIDENCE=%s/pr39-evidence\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the fixed plan and driver gates
        run: |
          python3 diagnostics/pr39-aarch64/test_campaign.py
          mkdir -p "$QUAL_EVIDENCE"
          python3 diagnostics/pr39-aarch64/campaign.py plan > "$QUAL_EVIDENCE/planned-rows.json"

      - name: Get the common BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-aarch64

      - name: Get JTReg
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: Prepare the normal native build toolchain
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16 ccache
          test "$(gcc-16 -dumpversion)" = 16
          test "$(g++-16 -dumpversion)" = 16

      - name: Pin the source trees and reject concurrent author changes
        run: python3 diagnostics/pr39-aarch64/prepare.py sources --root "$QUAL_ROOT" --evidence "$QUAL_EVIDENCE"

      - name: Build matched release images and candidate fastdebug
        timeout-minutes: 100
        env:
          BOOT_JDK: ${{ steps.bootjdk.outputs.path }}
          JTREG: ${{ steps.jtreg.outputs.path }}
        run: python3 diagnostics/pr39-aarch64/prepare.py build --root "$QUAL_ROOT" --evidence "$QUAL_EVIDENCE"

      - name: Compile one common JMH harness and check its fixtures on both images
        timeout-minutes: 8
        run: python3 diagnostics/pr39-aarch64/prepare.py compile --root "$QUAL_ROOT" --evidence "$QUAL_EVIDENCE"

      - name: Targeted native correctness and collector safety gates
        timeout-minutes: 62
        run: python3 diagnostics/pr39-aarch64/prepare.py correctness --root "$QUAL_ROOT" --evidence "$QUAL_EVIDENCE"

      - name: One fixed balanced performance campaign
        timeout-minutes: 30
        run: python3 diagnostics/pr39-aarch64/campaign.py measure --root "$QUAL_ROOT" --evidence "$QUAL_EVIDENCE"

      - name: Retain raw results and all incomplete or failed gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr39-native-aarch64-${{ github.run_id }}
          path: ${{ env.QUAL_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90

      - name: Record the qualification scope
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['QUAL_EVIDENCE'])
          passed = all((root / f'{gate}-pass.json').is_file() for gate in ('correctness', 'performance'))
          text = 'Fixed native ARM campaign passed.' if passed else 'ARM qualification remains incomplete. Inspect retained evidence; do not rerun timings automatically.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(text + '\n')
          PY
