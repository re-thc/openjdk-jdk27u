name: ZIP native result summary
on:
  push:
    branches: [pr/zlib-ng-native-comparison]
    paths: ['.github/workflows/zip-native-comparison.yml']
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 38175068362
          pattern: native-comparison-*
          path: validation/native-artifacts
      - name: Read completed native measurements
        run: python3 .github/scripts/summarize-native.py
