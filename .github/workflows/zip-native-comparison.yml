name: ZIP qualification result summary
on:
  push:
    branches: [pr/zlib-ng-native-comparison]
    paths: ['.github/workflows/zip-native-comparison.yml']
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 38176106419
          pattern: review-fixes-*
          path: validation/qualification-artifacts
      - name: Read qualification hardware and defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in sorted(Path('validation/qualification-artifacts').iterdir()):
              print('QUALIFICATION', root.name)
              for name in ('cpu.txt', 'source.txt', 'tests-passed.txt'):
                  print(name)
                  print((root / name).read_text())
              flags = (root / 'default-flags.txt').read_text()
              for line in flags.splitlines():
                  if any(key in line for key in ('UseAVX', 'UseAdler32', 'UseCRC32', 'UseZip')):
                      print(line)
          PY
