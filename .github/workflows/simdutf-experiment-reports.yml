name: SIMDUTF experiment report inspection
on:
  push:
    branches: [review/simdutf-experiment-reports]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: simdutf-ascii-interpreter-linux-aarch64
          run-id: 38553276216
          github-token: ${{ github.token }}
          path: reports/arm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: simdutf-ascii-interpreter-linux-x64
          run-id: 38553276216
          github-token: ${{ github.token }}
          path: reports/x64
      - name: Inspect jtreg errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in Path("reports").rglob("*.jtr"):
              text = f.read_text()
              if "test result: Error" in text or "test result: Failed" in text:
                  print("FAILED_REPORT", f)
                  print(text[-24000:])
          PY
