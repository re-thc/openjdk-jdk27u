name: Fixed direct N/S with single reset validation
on:
  push:
    tags: [diagnostic-tiny-zlib-direct-reset-validation-20261015-once]
permissions:
  contents: read
concurrency:
  group: direct-reset-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-ns:
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: production
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/reset-only
            .github/scripts/direct-candidate
            .github/workflows
      - name: Compiler prerequisites
        run: |
          for tool in gcc-14 make python3 ar nm; do
            command -v "$tool"
          done
      - name: Synthetic and protocol fixtures only
        run: python3 production/.github/scripts/direct-candidate/test_direct.py
      - name: Source-binding negative fixtures only
        run: python3 production/.github/scripts/direct-candidate/test_repair_preflight.py
      - name: One separately approved corrected N/S attempt
        run: python3 production/.github/scripts/direct-candidate/direct_study.py --root production --out validation/direct-reset-validation --execute-once
      - name: Export retained evidence only
        if: always()
        run: |
          python3 production/.github/scripts/direct-candidate/direct_score.py --export-local validation/direct-reset-validation
          if test -f validation/direct-reset-validation/REPORT.txt; then
            cat validation/direct-reset-validation/REPORT.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: direct-reset-validation-${{ github.run_id }}
          path: validation/direct-reset-validation
          retention-days: 90
          if-no-files-found: error
