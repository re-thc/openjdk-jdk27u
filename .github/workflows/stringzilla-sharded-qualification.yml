# Qualify one pinned source using matched complete-image controls.
name: StringZilla sharded native qualification
on:
  push:
    branches: [codex/stringzilla-sharded-qualification]
    paths: [.github/workflows/stringzilla-sharded-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stringzilla-sharded-qualification
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.pin.outputs.source }}
      helper-hash: ${{ steps.proof.outputs.helper-sha256 }}
      parent-manifest-hash: ${{ steps.proof.outputs.parent-manifest-sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Pin the fully reviewed candidate
        id: pin
        shell: python
        run: |
          import os, re, subprocess
          source = "4592230b14fc2f4b537b162fd7f6b791e882b615"
          assert re.fullmatch(r"[0-9a-f]{40}", source) and source != "0" * 40
          status = subprocess.check_output(["gh", "api", "repos/re-thc/openjdk-jdk27u/actions/runs/39073742791",
                                           "--jq", ".status"], text=True).strip()
          assert status == "completed", "Finish the existing qualification campaign first"
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("source=" + source + "\n")
      - name: Checkout pinned manifest and helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pin.outputs.source }}
          persist-credentials: false
          sparse-checkout: |
            doc/stringzilla/native-cases.tsv
            .github/scripts/stringzilla-performance.py
      - name: Checkout pinned auxiliary driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Prove the projected matrix has no duplicates or omissions
        id: proof
        shell: python
        env:
          SOURCE: ${{ steps.pin.outputs.source }}
        run: |
          import os, py_compile, subprocess
          path = "driver/.github/scripts/stringzilla-sharded.py"
          py_compile.compile(path, doraise=True)
          subprocess.run(["python", path, "proof", "--source", os.environ["SOURCE"]], check=True)
      - name: Retain the complete matrix proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringzilla-sharded-matrix-${{ github.sha }}
          path: perf-output/matrix-proof.json
          retention-days: 30

  prepare-jtreg:
    needs: configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configuration.outputs.source }}
          persist-credentials: false
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - uses: ./.github/actions/build-jtreg

  serial_pair:
    needs: [configuration, prepare-jtreg]
    uses: ./.github/workflows/stringzilla-sharded-build.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: serial
      runner: ubuntu-26.04
      platform: linux-x64
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  avx2_pair:
    needs: [configuration, prepare-jtreg]
    uses: ./.github/workflows/stringzilla-sharded-build.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: avx2
      runner: ubuntu-26.04
      platform: linux-x64
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  neon_pair:
    needs: [configuration, prepare-jtreg]
    uses: ./.github/workflows/stringzilla-sharded-build.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: neon
      runner: ubuntu-26.04-arm
      platform: linux-aarch64
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  msvc_pair:
    needs: [configuration, prepare-jtreg]
    uses: ./.github/workflows/stringzilla-sharded-build.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: msvc
      runner: windows-2025
      platform: windows-x64
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  serial_controls:
    needs: [configuration, serial_pair]
    strategy:
      fail-fast: false
      matrix:
        tier: [interpreter, c1, c2]
    uses: ./.github/workflows/stringzilla-sharded-measure.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: serial
      tier: ${{ matrix.tier }}
      runner: ubuntu-26.04
      artifact-id: ${{ needs.serial_pair.outputs.artifact-id }}
      artifact-digest: ${{ needs.serial_pair.outputs.artifact-digest }}
      original-image-hash: ${{ needs.serial_pair.outputs.original-image-hash }}
      fork-image-hash: ${{ needs.serial_pair.outputs.fork-image-hash }}
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  avx2_controls:
    needs: [configuration, avx2_pair]
    strategy:
      fail-fast: false
      matrix:
        tier: [interpreter, c1, c2]
    uses: ./.github/workflows/stringzilla-sharded-measure.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: avx2
      tier: ${{ matrix.tier }}
      runner: ubuntu-26.04
      artifact-id: ${{ needs.avx2_pair.outputs.artifact-id }}
      artifact-digest: ${{ needs.avx2_pair.outputs.artifact-digest }}
      original-image-hash: ${{ needs.avx2_pair.outputs.original-image-hash }}
      fork-image-hash: ${{ needs.avx2_pair.outputs.fork-image-hash }}
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  neon_controls:
    needs: [configuration, neon_pair]
    strategy:
      fail-fast: false
      matrix:
        tier: [interpreter, c1, c2]
    uses: ./.github/workflows/stringzilla-sharded-measure.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: neon
      tier: ${{ matrix.tier }}
      runner: ubuntu-26.04-arm
      artifact-id: ${{ needs.neon_pair.outputs.artifact-id }}
      artifact-digest: ${{ needs.neon_pair.outputs.artifact-digest }}
      original-image-hash: ${{ needs.neon_pair.outputs.original-image-hash }}
      fork-image-hash: ${{ needs.neon_pair.outputs.fork-image-hash }}
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  msvc_controls:
    needs: [configuration, msvc_pair]
    strategy:
      fail-fast: false
      matrix:
        tier: [interpreter, c1, c2]
    uses: ./.github/workflows/stringzilla-sharded-measure.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: msvc
      tier: ${{ matrix.tier }}
      runner: windows-2025
      artifact-id: ${{ needs.msvc_pair.outputs.artifact-id }}
      artifact-digest: ${{ needs.msvc_pair.outputs.artifact-digest }}
      original-image-hash: ${{ needs.msvc_pair.outputs.original-image-hash }}
      fork-image-hash: ${{ needs.msvc_pair.outputs.fork-image-hash }}
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  avx512_controls:
    needs: [configuration, avx2_pair]
    strategy:
      fail-fast: false
      matrix:
        tier: [interpreter, c1, c2]
    uses: ./.github/workflows/stringzilla-sharded-measure.yml
    with:
      source: ${{ needs.configuration.outputs.source }}
      backend: avx512
      tier: ${{ matrix.tier }}
      runner: ubuntu-26.04
      artifact-id: ${{ needs.avx2_pair.outputs.artifact-id }}
      artifact-digest: ${{ needs.avx2_pair.outputs.artifact-digest }}
      original-image-hash: ${{ needs.avx2_pair.outputs.original-image-hash }}
      fork-image-hash: ${{ needs.avx2_pair.outputs.fork-image-hash }}
      helper-hash: ${{ needs.configuration.outputs.helper-hash }}
      parent-manifest-hash: ${{ needs.configuration.outputs.parent-manifest-hash }}

  collect:
    if: ${{ !cancelled() && needs.configuration.result == 'success' }}
    needs: [configuration, serial_pair, avx2_pair, neon_pair, msvc_pair, serial_controls, avx2_controls, neon_controls, msvc_controls, avx512_controls]
    runs-on: ubuntu-24.04
    env:
      SOURCE: ${{ needs.configuration.outputs.source }}
      GH_TOKEN: ${{ github.token }}
      PAIR_SERIAL: ${{ toJSON(needs.serial_pair.outputs) }}
      PAIR_AVX2: ${{ toJSON(needs.avx2_pair.outputs) }}
      PAIR_NEON: ${{ toJSON(needs.neon_pair.outputs) }}
      PAIR_MSVC: ${{ toJSON(needs.msvc_pair.outputs) }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout expected manifest and helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configuration.outputs.source }}
          persist-credentials: false
          sparse-checkout: |
            doc/stringzilla/native-cases.tsv
            .github/scripts/stringzilla-performance.py
      - name: Checkout pinned strict collector and driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verify result artifacts and recreate each exact shard manifest
        shell: python
        run: |
          import os, subprocess
          subprocess.run(["python", "driver/.github/scripts/stringzilla-sharded.py", "collection",
                          "--source", os.environ["SOURCE"]], check=True)
      - name: Strictly validate all triplets and their exact matrix union
        shell: node {0}
        run: |
          const fs = require("fs");
          const collect = Function("return (" + fs.readFileSync("driver/.github/scripts/stringzilla-collector.js", "utf8") + ")")();
          const input = JSON.parse(fs.readFileSync("perf-output/collection-input.json", "utf8"));
          const expected = new Set(input.expected_physical_keys), seen = new Set(), all = [];
          const table = [
            "| Backend | Tier | Case | Original ns/op | Enabled ns/op | Disabled ns/op | Higher enabled mean |",
            "| --- | --- | --- | ---: | ---: | ---: | --- |"
          ];
          for (const entry of input.entries) {
            const result = collect(fs.readFileSync(entry.log_path, "utf8"), entry.backend, entry.job,
              entry.manifest, entry.source, entry.base, entry.expected);
            for (const group of result.groups) {
              const enabled = group.controls.enabled;
              const params = Object.fromEntries(Object.entries(enabled.params).sort(([a], [b]) => a.localeCompare(b)));
              const key = JSON.stringify([entry.backend, group.tier, enabled.benchmark, params]);
              if (!expected.has(key) || seen.has(key)) throw Error("Unexpected or duplicate physical configuration: " + key);
              seen.add(key);
              const higher = ["original", "disabled"].filter(control => group.comparisons[control].slower_mean);
              const cells = ["original", "enabled", "disabled"].map(control =>
                group.controls[control].score.toFixed(3) + " +/- " + group.controls[control].error.toFixed(3));
              table.push("| " + [entry.backend, group.tier, group.case, ...cells, higher.join(", ") || "-"].join(" | ") + " |");
            }
            all.push(result);
          }
          if (seen.size !== expected.size || [...expected].some(key => !seen.has(key))) throw Error("Incomplete physical matrix");
          fs.writeFileSync("perf-output/qualification.json", JSON.stringify({
            source: process.env.SOURCE, triplets: seen.size, records: seen.size * 3, shards: all
          }, null, 2) + "\n");
          fs.writeFileSync("perf-output/QUALIFICATION.md",
            "All accepted triplets retain matched original/enabled/disabled controls and every higher enabled mean.\n\n" +
            table.join("\n") + "\n");
          console.log("Qualified " + seen.size + " unique triplets across " + all.length + " backend/tier shards.");
      - name: Retain full evidence and every measured loss
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stringzilla-sharded-qualification-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: perf-output
          if-no-files-found: warn
          retention-days: 30
