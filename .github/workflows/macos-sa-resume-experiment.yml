name: macOS SA resume experiment

on:
  push:
    branches: [pr/diagnose-macos-sa-resume]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        group: [ci_sa_resume_checks]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8fc52ec2730bf7884267af6be8ac031a54d329b3

      - uses: ./.github/actions/get-bootjdk
        id: bootjdk
        with:
          platform: macos-aarch64

      - name: Download existing fastdebug image and native tests
        uses: actions/download-artifact@v8
        with:
          name: bundles-macos-aarch64-debug
          path: bundles
          run-id: 37404846164
          github-token: ${{ github.token }}

      - name: Download the same jtreg
        uses: actions/download-artifact@v8
        with:
          name: bundles-jtreg-8.2.1+1
          path: jtreg/installed
          run-id: 37404846164
          github-token: ${{ github.token }}

      - name: Install test dependencies
        run: |
          brew install make
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Unpack image and partition the unchanged test group
        id: paths
        run: |
          mkdir -p bundles/jdk bundles/symbols bundles/tests
          tar -xf bundles/jdk-macos-aarch64-debug.tar.gz -C bundles/jdk
          tar -xf bundles/tests-macos-aarch64-debug.tar.gz -C bundles/tests
          if [[ -f bundles/symbols-macos-aarch64-debug.tar.gz ]]; then
            tar -xf bundles/symbols-macos-aarch64-debug.tar.gz -C bundles/symbols
          fi
          jdk_bin=$(find bundles/jdk -type d -name bin -print -quit)
          echo "jdk=$GITHUB_WORKSPACE/$(dirname "$jdk_bin")" >> "$GITHUB_OUTPUT"
          echo "tests=$GITHUB_WORKSPACE/bundles/tests" >> "$GITHUB_OUTPUT"
          echo "symbols=$GITHUB_WORKSPACE/bundles/symbols" >> "$GITHUB_OUTPUT"
          cat >> test/hotspot/jtreg/TEST.groups <<'GROUPS'

          ci_sa_resume_checks = \
            serviceability/sa/CDSJMapClstats.java \
            serviceability/sa/ClhsdbAttach.java \
            serviceability/sa/ClhsdbAttachDifferentJVMs.java

          ci_serviceability_non_sa = \
            :tier1_serviceability \
            -serviceability/sa

          ci_serviceability_sa = \
            :tier1_serviceability \
            -:ci_serviceability_non_sa
          GROUPS

      - name: Rebuild only libsaproc with a balanced task resume
        env:
          TEST_JDK_PATH: ${{ steps.paths.outputs.jdk }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/jdk.hotspot.agent/macosx/native/libsaproc/MacosxDebuggerLocal.m')
          original = p.read_text()
          needle = '  detach_cleanup(gTask, env, this_obj, false);\n\n  JNI_COCOA_EXIT(env);'
          replacement = r"""
            // Balance task_suspend from attach before releasing the task port.
            k_res = task_resume(gTask);
            if (k_res != KERN_SUCCESS) {
              print_error("detach: task_resume() failed: '%s' (%d)\n",
                          mach_error_string(k_res), k_res);
              detach_cleanup(gTask, env, this_obj, true);
            } else {
              detach_cleanup(gTask, env, this_obj, false);
            }

            JNI_COCOA_EXIT(env);"""
          assert original.count(needle) == 1
          p.write_text(original.replace(needle, replacement))
          PY
          mkdir -p experimental/headers experimental/classes
          sa_src=src/jdk.hotspot.agent/share/classes
          "$TEST_JDK_PATH/bin/javac" --patch-module "jdk.hotspot.agent=$sa_src" \
            -h experimental/headers -d experimental/classes \
            "$sa_src/sun/jvm/hotspot/debugger/aarch64/AARCH64ThreadContext.java" \
            "$sa_src/sun/jvm/hotspot/debugger/amd64/AMD64ThreadContext.java" \
            "$sa_src/sun/jvm/hotspot/asm/Disassembler.java"
          sdk=$(xcrun --show-sdk-path)
          mig -isysroot "$sdk" -server experimental/mach_excServer.c \
            -user experimental/mach_excUser.c -header experimental/headers/mach_exc.h \
            "$sdk/usr/include/mach/mach_exc.defs"
          native_src=src/jdk.hotspot.agent/macosx/native/libsaproc
          shared_src=src/jdk.hotspot.agent/share/native/libsaproc
          xcrun clang -dynamiclib -O3 -g1 -fPIC -mcpu=apple-m1 \
            -D_GNU_SOURCE -D_LP64=1 -Daarch64 '-DARCH="aarch64"' \
            -mno-omit-leaf-frame-pointer -mstack-alignment=16 \
            -Iexperimental/headers -I"$native_src" -I"$shared_src" \
            -I"$TEST_JDK_PATH/include" -I"$TEST_JDK_PATH/include/darwin" \
            -Isrc/java.base/share/native/libjava -Isrc/hotspot/share/include \
            "$native_src/MacosxDebuggerLocal.m" "$native_src/libproc_impl.c" \
            "$native_src/ps_core.c" "$native_src/symtab.c" \
            "$shared_src/ps_core_common.c" "$shared_src/sadis.c" experimental/mach_excServer.c \
            -L"$TEST_JDK_PATH/lib" -ljava -Wl,-rpath,@loader_path \
            -framework CoreFoundation -framework Foundation -framework JavaRuntimeSupport \
            -framework Security -Wl,-install_name,@rpath/libsaproc.dylib \
            -o experimental/libsaproc.dylib
          codesign --force --sign - experimental/libsaproc.dylib
          cp "$TEST_JDK_PATH/lib/libsaproc.dylib" experimental/libsaproc.original.dylib
          cp experimental/libsaproc.dylib "$TEST_JDK_PATH/lib/libsaproc.dylib"

      - name: Run tests and record runner health
        timeout-minutes: 15
        env:
          TEST_GROUP: ${{ matrix.group }}
          BOOT_JDK_PATH: ${{ steps.bootjdk.outputs.path }}
          TEST_JDK_PATH: ${{ steps.paths.outputs.jdk }}
          SYMBOLS_PATH: ${{ steps.paths.outputs.symbols }}
          TEST_IMAGE_PATH: ${{ steps.paths.outputs.tests }}
        run: |
          (
            while true; do
              {
                date -u
                vm_stat
                sysctl vm.swapusage
                ps -axo pid,ppid,etime,rss,state,comm | sort -k4nr | head -40 || true
                if [[ -d build/run-test-prebuilt/test-support ]]; then
                  find build/run-test-prebuilt/test-support -name '*.jtr' -mmin -2 -print
                fi
              } >> diagnostics.log 2>&1
              sleep 60
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          make test-prebuilt TEST_JOBS=1 \
            TEST="test/hotspot/jtreg/:$TEST_GROUP" \
            BOOT_JDK="$BOOT_JDK_PATH" \
            JT_HOME="$GITHUB_WORKSPACE/jtreg/installed" \
            JDK_IMAGE_DIR="$TEST_JDK_PATH" \
            SYMBOLS_IMAGE_DIR="$SYMBOLS_PATH" \
            TEST_IMAGE_DIR="$TEST_IMAGE_PATH" \
            JTREG='JAVA_OPTIONS=-XX:-CreateCoredumpOnCrash -Djava.awt.headless=true;VERBOSE=fail,error,time;KEYWORDS=!headful' \
            2>&1 | tee test.log

      - name: Preserve focused regression results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: focused-sa-resume-results
          path: |
            test.log
            diagnostics.log
            build/run-test-prebuilt/test-results
            build/run-test-prebuilt/test-support/**/*.jtr
            experimental/libsaproc.dylib
          retention-days: 5

      - name: Run the full tier1 SA group with the experimental library
        timeout-minutes: 45
        env:
          BOOT_JDK_PATH: ${{ steps.bootjdk.outputs.path }}
          TEST_JDK_PATH: ${{ steps.paths.outputs.jdk }}
          SYMBOLS_PATH: ${{ steps.paths.outputs.symbols }}
          TEST_IMAGE_PATH: ${{ steps.paths.outputs.tests }}
        run: |
          make test-prebuilt TEST_JOBS=1 \
            TEST='test/hotspot/jtreg/:ci_serviceability_sa' \
            BOOT_JDK="$BOOT_JDK_PATH" \
            JT_HOME="$GITHUB_WORKSPACE/jtreg/installed" \
            JDK_IMAGE_DIR="$TEST_JDK_PATH" \
            SYMBOLS_IMAGE_DIR="$SYMBOLS_PATH" \
            TEST_IMAGE_DIR="$TEST_IMAGE_PATH" \
            JTREG='JAVA_OPTIONS=-XX:-CreateCoredumpOnCrash -Djava.awt.headless=true;VERBOSE=fail,error,time;KEYWORDS=!headful' \
            2>&1 | tee full-sa.log

      - name: Summarize completed tests
        if: always()
        run: bash .github/scripts/gen-test-results.sh "$GITHUB_STEP_SUMMARY"

      - name: Preserve partial results and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.group }}
          path: |
            diagnostics.log
            test.log
            full-sa.log
            build/run-test-prebuilt/test-results
            build/run-test-prebuilt/test-support/**/*.jtr
            build/run-test-prebuilt/test-support/**/hs_err*.log
          retention-days: 5
