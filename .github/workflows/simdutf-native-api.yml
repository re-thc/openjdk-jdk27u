name: SIMDUTF native converter APIs
on:
  push:
    branches: [review/simdutf-native-api-cost]
permissions:
  contents: read
jobs:
  controls:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare stable-snapshot conversion and validation APIs
        run: |
          mkdir -p results
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH docker --host=unix:///var/run/docker.sock run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" ubuntu:26.04 /bin/bash -c 'set -e
          apt-get -qq update
          DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3 gcc-16 g++-16 libstdc++6
          python3 make/scripts/simdutf-native-api.py
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simdutf-native-api-${{ matrix.platform }}
          path: results
          retention-days: 14
