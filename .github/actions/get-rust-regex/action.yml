name: 'Get Rust regex toolchain'
description: 'Install the Rust compiler and matching legal notices for native fork builds'
outputs:
  rustc:
    description: 'Resolved Rust compiler'
    value: ${{ steps.toolchain.outputs.rustc }}
runs:
  using: composite
  steps:
    - name: 'Install Rust and standard library notices'
      id: toolchain
      shell: bash
      run: |
        rust_version=1.99.1
        rustup toolchain install "$rust_version" --profile minimal --component rust-docs,rustfmt,clippy --no-self-update
        rustup default "$rust_version"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        compiler=$(rustup which --toolchain "$rust_version" rustc)
        echo "rustc=$compiler" >> "$GITHUB_OUTPUT"
