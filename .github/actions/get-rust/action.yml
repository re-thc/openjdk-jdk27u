name: 'Get Rust'
description: 'Expose the installed Rust toolchain and cache Cargo registry dependencies'
runs:
  using: composite
  steps:
    - name: 'Resolve installed Rust on Unix'
      id: unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        RUSTUP_AUTO_INSTALL: '0'
      run: |
        rustc=$(rustup which rustc)
        cargo=$(rustup which cargo)
        test -x "$rustc"
        test -x "$cargo"
        "$rustc" -vV
        "$cargo" -V
        dirname "$rustc" >> "$GITHUB_PATH"
        dirname "$cargo" >> "$GITHUB_PATH"
        echo "cargo-home=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"

    - name: 'Resolve installed Rust on Windows'
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RUSTUP_AUTO_INSTALL: '0'
      run: |
        $ErrorActionPreference = 'Stop'
        $rustup = (Get-Command rustup.exe -CommandType Application -ErrorAction Stop).Source
        $rustc = (& $rustup which rustc).Trim()
        if ($LASTEXITCODE -ne 0) { throw 'Installed rustc is unavailable' }
        $cargo = (& $rustup which cargo).Trim()
        if ($LASTEXITCODE -ne 0) { throw 'Installed Cargo is unavailable' }
        foreach ($tool in @($rustc, $cargo)) {
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw "Missing tool: $tool" }
          Split-Path -Parent $tool >> $env:GITHUB_PATH
        }
        "JDK_RUSTC=$rustc" >> $env:GITHUB_ENV
        "JDK_CARGO=$cargo" >> $env:GITHUB_ENV
        & $rustc -vV
        if ($LASTEXITCODE -ne 0) { throw 'rustc identity failed' }
        & $cargo -V
        if ($LASTEXITCODE -ne 0) { throw 'Cargo identity failed' }
        $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
        "cargo-home=$cargoHome" >> $env:GITHUB_OUTPUT

    - name: 'Cache Cargo registry dependencies'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.windows.outputs.cargo-home || steps.unix.outputs.cargo-home }}/registry/index
          ${{ steps.windows.outputs.cargo-home || steps.unix.outputs.cargo-home }}/registry/cache
          ${{ steps.windows.outputs.cargo-home || steps.unix.outputs.cargo-home }}/registry/src
        key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
