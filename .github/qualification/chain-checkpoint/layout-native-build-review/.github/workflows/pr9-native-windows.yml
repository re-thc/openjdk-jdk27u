name: 'Build (windows)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'product-bundles test-bundles'
      debug-levels:
        required: false
        type: string
        default: '[ "debug", "release" ]'
      msvc-toolset-version:
        required: true
        type: string
      architecture:
        required: true
        type: string
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

env:
  # These are needed to make the MSYS2 bash work properly
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  build-windows:
    name: build
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        debug-level: ${{ fromJSON(inputs.debug-levels) }}
        include:
          - debug-level: debug
            flags: --with-debug-level=fastdebug
            suffix: -debug

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c04d1ba1e96b2176ce8a8e56eacae73c2d356d2b
          fetch-depth: 1
          persist-credentials: false

      - name: 'Checkout immutable candidate bundle'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c158ea6ba18667c2e71127e9b1bb8b9b760f3fbd
          path: pr9-source-bootstrap
          sparse-checkout: .github/qualification/chain-checkpoint/layout-source-e41d
          persist-credentials: false

      - name: 'Restore and verify exact candidate source'
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$RUNNER_TEMP/pr9-source-bootstrap"
          test ! -e "$bootstrap"
          mv pr9-source-bootstrap "$bootstrap"
          bundle="$bootstrap/.github/qualification/chain-checkpoint/layout-source-e41d/layout-source.bundle"
          echo "79f0619e2fe9cf1b26b9526c615ce56c1d5b60082aa389c511098c9354ff1ed9  $bundle" | sha256sum --check
          git bundle verify "$bundle"
          git -c gc.auto=0 -c maintenance.auto=false fetch "$bundle" refs/heads/common-intrinsics:refs/remotes/qualification/candidate
          git checkout --detach e41d7823bf6de77c4bfba52e896bf325221488cb
          test "$(git rev-parse HEAD)" = e41d7823bf6de77c4bfba52e896bf325221488cb
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: 'Get MSYS2'
        uses: ./.github/actions/get-msys2
        with:
          architecture: ${{ inputs.architecture }}

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: ${{ inputs.platform }}

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Check toolchain installed for x64'
        id: toolchain-check-x64
        run: |
          set +e
          '/c/Program Files/Microsoft Visual Studio/18/Enterprise/vc/auxiliary/build/vcvars64.bat' -vcvars_ver=${{ inputs.msvc-toolset-version }}
          if [ $? -eq 0 ]; then
            echo "Toolchain is already installed for x64"
            echo "toolchain-installed=true" >> $GITHUB_OUTPUT
          else
            echo "Toolchain is not yet installed for x64"
            echo "toolchain-installed=false" >> $GITHUB_OUTPUT
          fi
        if: ${{ inputs.architecture == 'x86.x64' }}

      - name: 'Check toolchain installed for ARM64'
        id: toolchain-check-arm64
        run: |
          set +e
          "/c/Program Files/Microsoft Visual Studio/18/Enterprise/vc/auxiliary/build/vcvarsarm64.bat" -vcvars_ver=${{ inputs.msvc-toolset-version }}
          if [ $? -eq 0 ]; then
            echo "Toolchain is already installed for ARM64"
            echo "toolchain-installed=true" >> $GITHUB_OUTPUT
          else
            echo "Toolchain is not yet installed for ARM64"
            echo "toolchain-installed=false" >> $GITHUB_OUTPUT
          fi
        if: ${{ inputs.architecture == 'ARM64' }}

      - name: 'Install toolchain and dependencies for x64'
        run: |
          # Run Visual Studio Installer
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe' \
            modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\18\Enterprise' \
            --add Microsoft.VisualStudio.Component.VC.${{ inputs.msvc-toolset-version }}.x86.x64
        if: ${{ (inputs.architecture == 'x86.x64') && (steps.toolchain-check-x64.outputs.toolchain-installed != 'true') }}

      - name: 'Install toolchain and dependencies for ARM64'
        run: |
          # Run Visual Studio Installer
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe' \
            modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\18\Enterprise' \
            --add Microsoft.VisualStudio.Component.VC.${{ inputs.msvc-toolset-version }}.ARM64
        if: ${{ ( inputs.architecture == 'ARM64') && (steps.toolchain-check-arm64.outputs.toolchain-installed != 'true') }}

      - name: 'Configure'
        run: >
          bash bin/configure-dev
          --with-conf-name=${{ inputs.platform }}
          ${{ matrix.flags }}
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-jtreg=${{ steps.jtreg.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-toolchain-version=2026
          --with-msvc-toolset-version=${{ inputs.msvc-toolset-version }}
          --with-jmod-compress=zip-1
          --with-external-symbols-in-bundles=none
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)
        env:
          # We need a minimal PATH on Windows
          # Set PATH to "", so just GITHUB_PATH is included
          PATH: ''
        shell: env /usr/bin/bash --login -eo pipefail {0}

      - name: 'Verify configured toolchain'
        run: |
          spec="build/${{ inputs.platform }}/spec.gmk"
          test "$(awk '$1 == "TOOLCHAIN_TYPE" { print $3 }' "$spec")" = microsoft
          test "$(awk '$1 == "TOOLCHAIN_VERSION" { print $3 }' "$spec")" = 2026
          toolset='${{ inputs.msvc-toolset-version }}'
          # MSVC toolset 14.x uses compiler version 19.x.
          expected="$(( ${toolset%%.*} + 5 )).${toolset#*.}"
          for compiler in CC CXX; do
            version=$(awk -v key="${compiler}_VERSION_NUMBER" '$1 == key { print $3 }' "$spec")
            if [[ $version != "$expected".* ]]; then
              echo "Unexpected $compiler version: $version (expected $expected.x, toolset $toolset)" >&2
              exit 1
            fi
            echo "$compiler: $version (Visual Studio 2026, toolset $toolset)"
          done

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
        if: ${{ inputs.dry-run == false }}

      - name: 'Check development profile'
        run: bash .github/scripts/check-dev-profile.sh "build/${{ inputs.platform }}/images/jdk" "build/${{ inputs.platform }}/spec.gmk"
        if: ${{ inputs.dry-run == false }}

      - name: 'Verify actual JVM source and retain core payload identity'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e41d7823bf6de77c4bfba52e896bf325221488cb
          image="build/${{ inputs.platform }}/images/jdk"
          grep -Fx 'SOURCE=".:git:e41d7823bf6d"' "$image/release"
          identity="$RUNNER_TEMP/pr9-identity"
          mkdir -p "$identity"
          git rev-parse HEAD > "$identity/checkout-source.txt"
          cp "$image/release" "$identity/release"
          printf '%s\n' "$GITHUB_SHA" > "$identity/workflow-source.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > "$identity/workflow-ref.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$identity/workflow-run-id.txt"
          "$image/bin/java" -XX:ActiveProcessorCount=1 -version > "$identity/java-version.txt" 2>&1
          find "$image" -type f \( -name libjvm.so -o -name jvm.dll -o -name modules -o -name 'classes*.jsa' -o -name release \) -print0 | sort -z | xargs -0 sha256sum > "$identity/payload-sha256.txt"

      - name: 'Upload actual-source identity receipt'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr9-native-identity-${{ inputs.platform }}-${{ matrix.debug-level }}
          path: ${{ runner.temp }}/pr9-identity
          retention-days: 14

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
        if: ${{ inputs.dry-run == false }}
